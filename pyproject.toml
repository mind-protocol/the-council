# Le Conseil — declaration du projet Python.
#
# POURQUOI CE FICHIER. Le depot n'en avait aucun : ni `pyproject.toml`, ni
# `package.json`. Un outil Python lance ici (pytest, ruff, un formateur, un
# editeur) n'avait aucun moyen de savoir ou commence le projet, et remontait
# jusqu'au dossier de l'utilisateur pour trouver une configuration. Le meme
# defaut cote Node etait pire encore et se voyait a chaque execution : le
# `package.json` fantome de `C:\Users\reyno\` etait ce que Node lisait pour
# decider si `journee.js` etait un module — autrement dit, le depot heritait de
# la configuration Node du dossier utilisateur. C'est un defaut de
# reproductibilite qu'aucun banc ne voit passer, parce qu'il ne casse rien : il
# rend seulement deux machines differentes.

[project]
name = "le-conseil"
version = "0.0.0"
description = "Le Conseil — un jdr narratif solo et sa simulation d'acteurs."
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# LA CARTE DES PAQUETS. C'est la declaration que les outils lisent (et ce que
# `pip install -e .` installerait, dans un venv, si on le decidait un jour) :
# les containers de scripts/ sont des paquets, importables par nom qualifie
# (`from etat.expose import tables`) des que scripts/ est sur sys.path.
packages = [
    "noyau", "etat", "temps", "agents", "plan", "scene", "monde",
    "peinture", "analyse", "figures", "ville",
    "materialisation", "migrations", "tests",
]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.pytest.ini_options]
# Ou sont les epreuves. `scripts/` entre dans `sys.path` pour que les tests
# importent les modules comme le font les scripts eux-memes.
testpaths = ["scripts/tests", "serveur"]
pythonpath = ["scripts", "scripts/noyau"]
python_files = ["test_*.py", "banc_*.py"]

[tool.ruff]
line-length = 100
exclude = ["monde", "captures", "voix", "vendor", "__pycache__", "archive"]

# ---------------------------------------------------------------------------
# L'ETAT DES AMORCES, ET LA DECISION DIFFEREE
#
# Les paquets sont desormais DECLARES ci-dessus, et les `sys.path.insert`
# redondants (l'insert isole qui doublait l'amorce canonique dans le meme
# fichier, ou le sys.path[0] que Python pose deja) ont ete retires — 35 lignes.
#
# Ce qui RESTE est l'amorce canonique de scripts/CLAUDE.md (« le chemin des
# freres »), et elle est portante a trois endroits :
#
#   - les COMMANDES (racine et sous-dossiers) : ce sont les points d'entree,
#     l'amorce est ce qui rend `noyau/` visible pour les imports a nom nu
#     (`import tables`, `import bibliotheque`) ;
#   - les PORTES (`<container>/expose.py`) : leur amorce bootstrappe le chemin
#     pour les entrees qui n'en ont pas (evaluer.py importe temps.expose et
#     ne porte rien d'autre) ;
#   - les TESTS : `unittest discover -s scripts/tests` met scripts/tests en
#     sys.path, pas scripts/.
#
# Les faire disparaitre exige UNE decision, pas un nettoyage : soit
# `pip install -e .` — mais dans le Python GLOBAL de la machine, cela pose
# `monde`, `plan`, `analyse` en noms de premier niveau pour tous les projets,
# et il n'y a pas de venv ici ; soit reecrire tous les imports a nom nu en
# noms qualifies (`from noyau import tables`) — d'un bloc, car un depot moitie
# nu moitie qualifie importe le meme module deux fois sous deux noms, chacun
# avec son etat. Les deux se decident, elles ne se glissent pas dans un
# commit. Deja acquis pour le jour venu : la carte des paquets ci-dessus, et
# des amorces identiques partout (une seule forme a supprimer).
