<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Régie — Le Conseil</title>
<style>
  :root {
    --fond: #14110e; --fond2: #1c1815; --bord: #3a3128; --texte: #e6ddd0;
    --pale: #9a8f80; --or: #c8a44a; --rouge: #c05a44; --vert: #6f8f5e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte);
    font: 14px/1.45 "Iowan Old Style", Georgia, serif; }
  header { display: flex; align-items: baseline; gap: 1.2rem; flex-wrap: wrap;
    padding: .8rem 1.2rem; border-bottom: 1px solid var(--bord); background: var(--fond2); }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: .12em;
    text-transform: uppercase; color: var(--or); font-weight: normal; }
  header .date { color: var(--pale); }
  header .avert { margin-left: auto; color: var(--rouge); font-size: .8rem;
    letter-spacing: .05em; text-transform: uppercase; }
  nav { display: flex; gap: .3rem; padding: .5rem 1.2rem 0; border-bottom: 1px solid var(--bord); }
  nav button { background: none; border: 1px solid transparent; border-bottom: none;
    color: var(--pale); padding: .4rem .9rem; font: inherit; cursor: pointer; }
  nav button.actif { color: var(--or); border-color: var(--bord); background: var(--fond2); }
  main { padding: 1.2rem; }
  section { display: none; } section.actif { display: block; }
  h2 { font-size: .85rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--pale); font-weight: normal; margin: 1.6rem 0 .5rem; }
  h2:first-child { margin-top: 0; }
  h2 .compte { color: var(--or); }
  h2 .deborde { color: var(--rouge); }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-weight: normal; font-size: .72rem; color: var(--pale);
    letter-spacing: .08em; text-transform: uppercase; padding: .3rem .6rem;
    border-bottom: 1px solid var(--bord); }
  td { padding: .35rem .6rem; border-bottom: 1px solid #241f1a; vertical-align: top; }
  tr:hover td { background: #1a1613; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chaud { color: var(--rouge); }
  .froid { color: var(--pale); }
  .quoi { color: var(--pale); font-size: .88rem; }
  .nom { color: var(--texte); }
  .siege { color: var(--or); }
  .alertes { border: 1px solid var(--bord); background: var(--fond2); padding: .6rem .9rem; }
  .alertes div { padding: .12rem 0; font-size: .88rem; }
  .alertes .grave { color: var(--rouge); }
  .alertes .tiede { color: var(--or); }
  .vide { color: var(--pale); font-style: italic; }
  .jour { color: var(--or); font-variant-numeric: tabular-nums; }
  .fam { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--pale); }
  .barre { height: 4px; background: #2a241e; margin-top: .25rem; }
  .barre i { display: block; height: 100%; background: var(--vert); }
  .barre i.court { background: var(--rouge); }
  footer { padding: 1rem 1.2rem; color: var(--pale); font-size: .8rem; }
  button.recharger { background: none; border: 1px solid var(--bord); color: var(--pale);
    padding: .25rem .7rem; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Régie</h1>
  <span class="date" id="date"></span>
  <button class="recharger" onclick="charger()">Relire l'état</button>
  <span class="avert">Envers du décor — jamais sous les yeux du joueur</span>
</header>
<nav>
  <button data-onglet="tetes" class="actif">Les têtes</button>
  <button data-onglet="calendrier">Le calendrier</button>
  <button data-onglet="mains">Les mains</button>
  <button data-onglet="tissu">Le tissu</button>
  <button data-onglet="maison">La maison</button>
  <button data-onglet="travail">Le travail</button>
  <button data-onglet="enface">En face</button>
</nav>
<main>
  <section id="tetes" class="actif"></section>
  <section id="calendrier"></section>
  <section id="mains"></section>
  <section id="tissu"></section>
  <section id="maison"></section>
  <section id="travail"></section>
  <section id="enface"></section>
</main>
<footer id="pied"></footer>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button").forEach((x) => x.classList.remove("actif"));
  document.querySelectorAll("main section").forEach((x) => x.classList.remove("actif"));
  b.classList.add("actif");
  $("#" + b.dataset.onglet).classList.add("actif");
});

function rendreTetes(d) {
  let h = "";
  if (d.alertes.length) {
    h += '<h2>Ce qui cloche</h2><div class="alertes">' + d.alertes
      .map((a) => '<div class="' + a.gravite + '">' + esc(a.texte) + "</div>").join("") + "</div>";
  }
  const groupes = d.groupes.concat(
    d.hors_echelle.length ? [{ echelle: "hors échelle", budget: null, tetes: d.hors_echelle }] : []);
  groupes.forEach((g) => {
    const deborde = g.budget && g.tetes.length > g.budget;
    h += '<h2>' + esc(g.echelle) + ' <span class="' + (deborde ? "deborde" : "compte") + '">'
      + g.tetes.length + (g.budget ? " / ~" + g.budget : "") + "</span></h2>";
    if (!g.tetes.length) { h += '<p class="vide">personne</p>'; return; }
    h += "<table><tr><th>Qui</th><th>Où</th><th>Intention</th>"
      + '<th class="num">Étapes</th><th class="num">Prochaine</th>'
      + '<th class="num">Décl.</th><th class="num">Relue</th><th>Attitude</th></tr>';
    g.tetes.forEach((t) => {
      const vieille = t.age_maj !== null && t.age_maj >= 3 && t.echelle !== "royaume";
      h += "<tr><td>" + (t.siege ? '<span class="siege">◆ </span>' : "")
        + '<span class="nom">' + esc(t.nom) + "</span></td>"
        + '<td class="froid">' + esc(t.lieu) + "</td>"
        + '<td class="quoi">' + esc(t.intention) + "</td>"
        + '<td class="num">' + t.etapes + " / " + t.etapes_total
        + (t.sans_horloge ? ' <span class="chaud">(' + t.sans_horloge + " sans h.)</span>" : "") + "</td>"
        + '<td class="num">' + (t.prochaine === null ? '<span class="froid">—</span>'
          : '<span class="' + (t.prochaine <= 1 ? "chaud" : "jour") + '">' + t.prochaine + " j</span>") + "</td>"
        + '<td class="num froid">' + t.declencheurs + "</td>"
        + '<td class="num ' + (vieille ? "chaud" : "froid") + '">'
        + (t.age_maj === null ? "—" : t.age_maj + " j") + "</td>"
        + '<td class="quoi">' + esc(t.attitude) + "</td></tr>";
      if (t.prochaine !== null)
        h += '<tr><td></td><td colspan="7" class="quoi">↳ ' + esc(t.prochaine_quoi) + "</td></tr>";
    });
    h += "</table>";
  });
  $("#tetes").innerHTML = h;
}

function rendreCalendrier(d) {
  const fen = d.echeances.filter((e) => e.jours <= 30);
  let h = '<h2>Les trente prochains jours <span class="compte">' + fen.length + "</span></h2>";
  if (!fen.length) { h += '<p class="vide">rien ne tombe</p>'; }
  else {
    h += "<table><tr><th>Quand</th><th>Quoi</th><th>Sur qui</th><th>Où</th><th></th></tr>";
    let dernier = null;
    fen.forEach((e) => {
      if (e.jours !== dernier) {
        dernier = e.jours;
        const q = e.jours < 0 ? "EN RETARD de " + (-e.jours) + " j"
          : e.jours === 0 ? "AUJOURD'HUI" : "dans " + e.jours + " j";
        h += '<tr><td colspan="5" class="' + (e.jours <= 0 ? "chaud" : "jour")
          + '" style="padding-top:.7rem">' + q + "</td></tr>";
      }
      h += '<tr><td class="fam">' + esc(e.famille) + "</td>"
        + '<td class="quoi">' + esc(e.quoi) + "</td>"
        + '<td class="froid">' + esc(e.qui || "") + "</td>"
        + '<td class="froid">' + esc(e.lieu || "") + "</td>"
        + '<td class="froid num">' + esc(e.etat || e.bloque || (e.importance ? "imp. " + e.importance : "")) + "</td></tr>";
    });
    h += "</table>";
  }
  const loin = d.echeances.filter((e) => e.jours > 30);
  if (loin.length) {
    h += '<h2>Plus loin <span class="compte">' + loin.length + "</span></h2><table>";
    loin.forEach((e) => {
      h += '<tr><td class="num jour">' + e.jours + ' j</td><td class="fam">' + esc(e.famille)
        + '</td><td class="quoi">' + esc(e.quoi) + '</td><td class="froid">' + esc(e.qui || "") + "</td></tr>";
    });
    h += "</table>";
  }
  $("#calendrier").innerHTML = h;
}

function rendreActivites(d) {
  let h = '<h2>Où en sont les choses <span class="compte">' + d.mains.length + "</span></h2>";
  if (!d.mains.length) { $("#mains").innerHTML = h + '<p class="vide">aucune main</p>'; return; }
  h += "<table><tr><th>Mesure</th><th class=\"num\">Valeur</th><th class=\"num\">Rythme</th>"
    + '<th class="num">Seuil dans</th><th>Ce que ça devient</th><th>Porteur</th>'
    + '<th>Mandat</th><th class="num">Rapport</th></tr>';
  d.mains.forEach((a) => {
    h += '<tr><td colspan="8" class="fam" style="padding-top:.7rem;color:var(--or)">'
      + esc(a.id) + ' — <span class="quoi">' + esc(a.quoi) + "</span></td></tr>";
    a.mesures.forEach((m) => {
      const court = m.jours_avant_seuil !== null && m.jours_avant_seuil <= 15;
      h += '<tr><td class="quoi">' + esc(m.quoi) + "</td>"
        + '<td class="num nom">' + esc(m.valeur) + " " + esc(m.unite) + "</td>"
        + '<td class="num froid">' + (m.par > 0 ? "+" : "") + m.par + " / j</td>"
        + '<td class="num ' + (court ? "chaud" : "jour") + '">'
        + (m.jours_avant_seuil === null ? '<span class="froid">—</span>' : m.jours_avant_seuil + " j") + "</td>"
        + '<td class="quoi">' + esc(m.seuil) + "</td>"
        + '<td class="' + (a.sans_porteur ? "chaud" : "froid") + '">' + esc(a.porteur) + "</td>"
        + '<td class="froid">' + esc(a.mandat || "— sans mandat") + "</td>"
        + '<td class="num ' + (a.rapport_age === null || a.rapport_age >= 3 ? "chaud" : "froid") + '">'
        + (a.dernier_rapport
          ? esc(a.dernier_rapport) + (a.rapport_age === null ? "" : " (" + a.rapport_age + " j)")
            + (a.rapport_a ? " → " + esc(a.rapport_a) : "")
          : "jamais dit") + "</td></tr>";
    });
    a.franchis.forEach((s) => {
      h += '<tr><td colspan="8" class="chaud">⚑ seuil franchi le ' + esc(s.le)
        + (s.promeut ? " → " + esc(s.promeut) : "") + " : " + esc(s.affaire) + "</td></tr>";
    });
  });
  h += "</table>";
  $("#mains").innerHTML = h;
}


function rendreTissu(d) {
  const t = d.tissu;
  const e = document.getElementById('tissu');
  if (!t) {
    e.innerHTML = '<h2>Le tissu</h2><div class="alertes"><div class="tiede">' +
      'Aucun tissu calcule. Lancer : python scripts/tisser.py --ecrire ' +
      'puis python scripts/evaluer.py --json</div></div>';
    return;
  }
  const age = t.calcule_il_y_a_s;
  const vieux = age > 3600;
  let h = '<h2>Le tissu</h2>';
  h += '<div class="alertes"><div class="' + (vieux ? 'tiede' : '') + '">' +
       t.noeuds + ' noeuds, ' + t.aretes + ' aretes — calcule il y a ' +
       (age < 90 ? age + ' s' : Math.round(age / 60) + ' min') +
       (vieux ? ' — A RECALCULER' : '') + '</div></div>';

  h += '<h2>Les goulots</h2><table><tr><th>demandes</th><th>noeud</th><th></th></tr>';
  (t.goulots || []).forEach(function (g) {
    h += '<tr><td>' + g.demandes + '</td><td>' + g.noeud + '</td><td>' +
         (g.quoi || '') + (g.sature ? ' <b>SATURE</b>' : '') + '</td></tr>';
  });
  h += '</table>';

  h += '<h2>Les pressions sans contre-arete</h2>';
  (t.desequilibres || []).forEach(function (x) {
    h += '<div class="alertes"><div class="grave">' + x.noeud + ' — ' +
         (x.quoi || '') + '</div><div>' + x.consommateurs +
         ' consommateurs, aucun producteur</div>';
    (x.candidats || []).forEach(function (c) {
      h += '<div class="tiede">candidat non relie : ' + c.id + ' — ' +
           (c.quoi || '') + '</div>';
    });
    h += '</div>';
  });

  h += '<h2>Ce qui ne tombe sur personne</h2><div class="alertes"><div>' +
       t.vacantes + ' actions a designer</div><div>' +
       (t.sourds || []).length + ' tetes sans declencheur</div><div>' +
       t.murs_sans_route + ' verrous d\'en face sans route de fuite</div></div>';

  const F = (t.force || []).filter(function (x) { return x.questions > 0; });
  if (F.length) {
    h += '<h2>La force narrative <span class="compte">' +
         F.reduce(function (a, x) { return a + x.questions; }, 0) +
         ' questions sur ' + F.length + ' têtes</span></h2>' +
         '<table><tr><th>force</th><th>questions</th><th>qui</th>' +
         '<th>échelle</th><th>actions</th><th>critiques</th><th>goulot</th></tr>';
    F.forEach(function (x) {
      h += '<tr><td>' + x.force + '</td><td>' + x.questions + '</td><td>' +
           esc(x.qui) + '</td><td>' + esc(x.echelle || '') + '</td><td>' +
           x.actions + '</td><td>' + (x.critiques || '') + '</td><td>' +
           (x.goulots || []).map(function (g) {
             return esc(g.split(':').pop()); }).join(' ') + '</td></tr>';
    });
    h += '</table>';
  }

  (t.critique || []).forEach(function (c) {
    h += '<h2>Le chemin critique — ' + c.maillons + ' maillons</h2><table>';
    c.chaine.forEach(function (x) {
      h += '<tr><td>' + x.id + '</td><td>' + (x.quoi || '') + '</td></tr>';
    });
    h += '</table>';
  });
  e.innerHTML = h;
}

function rendreMaison(d) {
  const t = (d.tissu || {}).presence, e = document.getElementById('maison');
  if (!t) { e.innerHTML = '<h2>La maison</h2><div class="alertes"><div class="tiede">Aucun tissu.</div></div>'; return; }
  if (t.erreur) { e.innerHTML = '<h2>La maison</h2><div class="alertes"><div class="grave">' + esc(t.erreur) + '</div></div>'; return; }
  let h = '<h2>Où est chacun <span class="compte">' + (t.salles || []).length + ' salles</span></h2><table>';
  (t.salles || []).forEach(function (s) {
    h += '<tr><td>' + esc(s.salle) + '</td><td>' + s.gens.map(esc).join(', ') + '</td></tr>';
  });
  h += '</table>';
  if ((t.en_chemin || []).length) {
    h += '<h2>Dans les escaliers <span class="compte">' + t.en_chemin.length +
         '</span></h2><table>';
    t.en_chemin.forEach(function (x) {
      h += '<tr><td>' + esc(x.qui) + '</td><td>' + esc(x.de) + ' → ' + esc(x.vers) + '</td></tr>';
    });
    h += '</table>';
  } else {
    h += '<div class="alertes"><div>Personne dans les escaliers à cette minute.</div></div>';
  }
  e.innerHTML = h;
}

function rendreTravail(d) {
  const t = d.tissu || {}, e = document.getElementById('travail');
  let h = '<h2>Qui doit une journée <span class="compte">' +
          (t.convocations || []).length + '</span></h2>';
  (t.convocations || []).forEach(function (c) {
    h += '<div class="alertes"><div><b>' + esc(c.qui) + '</b></div>';
    (c.motifs || []).forEach(function (m) { h += '<div class="tiede">' + esc(m) + '</div>'; });
    h += '</div>';
  });
  h += '<h2>Qui a quelque chose à dire <span class="compte">' +
       (t.travaux || []).filter(function (x) { return x.verdict === 'parle'; }).length +
       ' / ' + (t.travaux || []).length + '</span></h2>' +
       '<table><tr><th>exc.</th><th>verdict</th><th>qui</th><th>affaire</th><th>pensées</th></tr>';
  (t.travaux || []).forEach(function (x) {
    h += '<tr><td>' + x.excitation + '</td><td>' + esc(x.verdict) + '</td><td>' +
         esc(x.qui) + '</td><td>' + esc(x.affaire || '') +
         (x.en_retard ? ' <b>EN RETARD</b>' : (x.due ? ' <b>DÛ</b>' : '')) +
         '</td><td>' + x.pensees + '</td></tr>';
  });
  h += '</table>';
  e.innerHTML = h;
}

function rendreEnFace(d) {
  const P = (d.tissu || {}).en_face || [], e = document.getElementById('enface');
  if (!P.length) { e.innerHTML = '<h2>En face</h2><div class="alertes"><div class="tiede">Aucun plan adverse écrit.</div></div>'; return; }
  let h = '';
  P.forEach(function (p) {
    h += '<h2>' + esc(p.titre) + ' <span class="compte">' + esc(p.id) + '</span></h2>';
    h += '<table><tr><th>verrou</th><th>portée pour nous</th><th></th></tr>';
    (p.verrous || []).forEach(function (v) {
      h += '<tr><td>' + esc(v.id) + '</td><td>' + esc(v.portee) + '</td><td>' +
           esc(v.quoi) + '</td></tr>';
    });
    h += '</table>';
    if ((p.engendre || []).length) {
      h += '<h2>Ce que ça engendre chez nous</h2>';
      p.engendre.forEach(function (x) {
        h += '<div class="alertes"><div><b>[' + esc(x.type) + ']</b> ' +
             esc(x.sujet) + '</div><div class="tiede">' + esc(x.pourquoi) + '</div></div>';
      });
    }
    (p.tensions || []).forEach(function (x) {
      h += '<div class="alertes"><div class="grave">' + esc(x.id) + ' — ' +
           esc(x.monnaie) + '</div><div>' + esc(x.ecart) + '</div></div>';
    });
  });
  e.innerHTML = h;
}

async function charger() {
  const r = await fetch("/admin/donnees", { cache: "no-store" });
  const d = await r.json();
  if (d.erreur) { $("#pied").textContent = "erreur : " + d.erreur; return; }
  $("#date").textContent = d.date_texte
    + (d.tension === null ? "" : " · tension " + d.tension)
    + (d.phase ? " · " + d.phase : "");
  rendreTetes(d); rendreCalendrier(d); rendreActivites(d);
  rendreTissu(d);
  rendreMaison(d); rendreTravail(d); rendreEnFace(d);
  const hs = Object.keys(d.horloges || {})
    .map((k) => k + " " + d.horloges[k].jour + "." + String(Math.floor(d.horloges[k].minute / 60)).padStart(2, "0")
      + "h" + String(d.horloges[k].minute % 60).padStart(2, "0")).join("  ·  ");
  $("#pied").textContent = "Horloges des sièges : " + hs + "   —   relu à "
    + new Date().toLocaleTimeString("fr-FR");
}
charger();
</script>
</body>
</html>
