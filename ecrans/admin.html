<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Régie — Le Conseil</title>
<style>
  :root {
    --fond: #14110e; --fond2: #1c1815; --bord: #3a3128; --texte: #e6ddd0;
    --pale: #9a8f80; --or: #c8a44a; --rouge: #c05a44; --vert: #6f8f5e;
    --bleu: #5c8fb5; --violet: #9b72b0; --orange: #c78345;

  * { box-sizing: border-box; }

  header { display: flex; align-items: baseline; gap: 1.2rem; flex-wrap: wrap;

  header h1 { font-size: 1rem; margin: 0; letter-spacing: .12em;

  nav button.actif { color: var(--or); border-color: var(--bord); background: var(--fond2); }
  main { padding: 1.2rem; }

  h2 { font-size: .85rem; letter-spacing: .1em; text-transform: uppercase;

  tr:hover td { background: #1a1613; }

<body>
<header>
  <h1>Régie</h1>

  <!-- UNE PAGE QU'AUCUN LIEN NE MONTRE N'EXISTE PAS. « Les pas » vivait à son
       adresse depuis une heure et il a fallu demander où elle était : les deux
       écrans hors fiction doivent se tenir par la main, sinon le second se
       retrouve par la mémoire de son URL, c'est-à-dire jamais. -->

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

async function ecrirePressePapiers(texte) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(texte);
      return;
    } catch (_erreur) {
      // Les contextes sans permission passent par la voie de compatibilité.
    }
  }
  const zone = document.createElement("textarea");
  zone.value = texte;
  zone.setAttribute("readonly", "");
  zone.style.position = "fixed";
  zone.style.opacity = "0";
  document.body.appendChild(zone);
  zone.select();
  const copie = document.execCommand("copy");
  zone.remove();
  if (!copie) throw new Error("Le presse-papiers a refusé la copie.");
}

function texteCopiable(element) {
  const copie = element.cloneNode(true);
  copie.querySelectorAll("canvas, script, style").forEach((x) => x.remove());
  copie.querySelectorAll("details").forEach((x) => x.open = true);
  copie.style.cssText = "display:block;position:fixed;left:-100000px;top:0;" +
    "width:1200px;height:auto;overflow:visible;";
  document.body.appendChild(copie);
  const texte = copie.innerText.trim();
  copie.remove();
  return texte;
}

// L'ONGLET COURANT VIT DANS L'URL. Sans cela, tout rechargement — et il y en a
// un a chaque fois qu'on touche a la page — ramenait a « Les tetes », et il
// fallait recliquer pour retrouver ce qu'on etait en train de regarder.
// `?onglet=graphe` se partage aussi : on envoie une vue, pas un chemin a
// refaire. `remplacerEtat` et non `pushState` : ce n'est pas une navigation,
// c'est ou l'on en est.
function ecrireOngletDansURL(onglet) {
  try {
    const u = new URL(window.location.href);
    if (onglet && onglet !== "tetes") u.searchParams.set("onglet", onglet);
    else u.searchParams.delete("onglet");
    history.replaceState(null, "", u);
  } catch (_e) { /* une URL qui ne s'ecrit pas ne doit pas casser l'onglet */ }
}
function ongletDeLURL() {
  try {
    const demande = new URL(window.location.href).searchParams.get("onglet");
    if (!demande) return null;
    return document.querySelector('nav button[data-onglet="' + CSS.escape(demande) + '"]')
      ? demande : null;
  } catch (_e) { return null; }
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  ecrireOngletDansURL(b.dataset.onglet);
  document.querySelectorAll("nav button").forEach((x) => x.classList.remove("actif"));
  document.querySelectorAll("main section").forEach((x) => x.classList.remove("actif"));
  b.classList.add("actif");
  $("#" + b.dataset.onglet).classList.add("actif");
  if (b.dataset.onglet === "graphe") requestAnimationFrame(() => {
    choisirLentille("importance");
    chargerActionsActivationGraphe();
    ajusterGraphe(); reveillerGraphe(.25);
    if (!G.cadreValide) {
      cadrerGraphe(G.principal);
      setTimeout(() => { if (cadrerGraphe(G.principal)) G.cadreValide = true; }, 850);
    }
  });
  if (b.dataset.onglet === "activations") {
    chargerActivations().then(() => actualiserFilMjActif());
  }
  if (b.dataset.onglet === "chambres") chargerChambres();
  if (b.dataset.onglet === "sante") chargerSante();
});

// ---------------------------------------------------------------- LA SANTÉ
// `tick.py --verifier` produisait deja tout ceci ; il sortait dans un
// terminal et personne ne le lisait. Meme texte, meme gravites — on ne
// reformule pas, un panneau qui dit autre chose que le terminal ne vaut rien.

const GRAVITES = ["grave", "avertissement", "note"];

async function chargerSante() {
  $("#sante").innerHTML = '<h2>La santé de l\'état</h2>'
    + '<p class="pale">audit en cours (quelques secondes)…</p>';
  let d;
  try {
    const r = await fetch("/admin/sante", { cache: "no-store" });
    d = await r.json();
  } catch (e) {
    $("#sante").innerHTML = '<h2>La santé de l\'état</h2><div class="alertes">'
      + '<div class="grave">' + esc(String(e.message || e)) + "</div></div>";
    return;
  }
  const anomalies = d.anomalies || [];
  let h = '<h2>La santé de l\'état</h2>';
  if (d.erreur) {
    h += '<div class="alertes"><div class="grave">' + esc(d.erreur) + "</div></div>";
  }
  h += '<p class="bandeau-sante">'
    + '<span class="grave">' + (d.durs || 0) + " anomalie(s)</span>"
    + ' · <span class="pale">' + (d.notes || 0) + " note(s) informative(s)</span>"
    + ' · <button id="sante-relire">relire</button></p>';
  if (!anomalies.length) {
    h += '<p class="pale">Rien à signaler.</p>';
  }
  GRAVITES.forEach((g) => {
    const lot = anomalies.filter((a) => a.gravite === g);
    if (!lot.length) return;
    // Grouper par sujet : dix lignes sur le meme personnage sont un probleme,
    // pas dix.
    const parSujet = new Map();
    lot.forEach((a) => {
      if (!parSujet.has(a.sujet)) parSujet.set(a.sujet, []);
      parSujet.get(a.sujet).push(a.texte);
    });
    h += "<h2>" + g.toUpperCase() + ' <span class="'
      + (g === "note" ? "compte" : "deborde") + '">' + lot.length + "</span></h2>"
      + "<table><thead><tr><th>Sujet</th><th>Ce qui cloche</th></tr></thead><tbody>"
      + [...parSujet.entries()].map(([sujet, textes]) =>
          "<tr><td>" + esc(sujet) + "</td><td>"
          + textes.map((t) => "<div>" + esc(t) + "</div>").join("")
          + "</td></tr>").join("")
      + "</tbody></table>";
  });
  h += '<p class="pale">Audit relu à ' + new Date(d.lu_a || Date.now())
    .toLocaleTimeString("fr-FR") + " — <code>python scripts/tick.py --verifier</code>"
    + " donne exactement la même chose au terminal.</p>";
  $("#sante").innerHTML = h;
  const b = $("#sante-relire");
  if (b) b.onclick = chargerSante;
}

function rendreTetes(d) {
  let h = "";
  if (d.alertes.length) {
    h += '<h2>Ce qui cloche</h2><div class="alertes">' + d.alertes
      .map((a) => '<div class="' + a.gravite + '">' + esc(a.texte) + "</div>").join("") + "</div>";
  }
  const groupes = d.groupes.concat(
    d.hors_echelle.length ? [{ echelle: "hors échelle", budget: null, tetes: d.hors_echelle }] : []);
  groupes.forEach((g) => {
    const deborde = g.budget && g.tetes.length > g.budget;
    h += '<h2>' + esc(g.echelle) + ' <span class="' + (deborde ? "deborde" : "compte") + '">'
      + g.tetes.length + (g.budget ? " / ~" + g.budget : "") + "</span></h2>";
    if (!g.tetes.length) { h += '<p class="vide">personne</p>'; return; }
    h += "<table><tr><th>Qui</th><th>Où</th><th>Intention</th>"
      + '<th class="num">Étapes</th><th class="num">Prochaine</th>'
      + '<th class="num">Décl.</th><th class="num">Relue</th><th>Attitude</th></tr>';
    g.tetes.forEach((t) => {
      const vieille = t.age_maj !== null && t.age_maj >= 3 && t.echelle !== "royaume";
      h += "<tr><td>" + (t.siege ? '<span class="siege">◆ </span>' : "")
        + '<span class="nom">' + esc(t.nom) + "</span></td>"
        + '<td class="froid">' + esc(t.lieu) + "</td>"
        + '<td class="quoi">' + esc(t.intention) + "</td>"
        + '<td class="num">' + t.etapes + " / " + t.etapes_total
        + (t.sans_horloge ? ' <span class="chaud">(' + t.sans_horloge + " sans h.)</span>" : "") + "</td>"
        + '<td class="num">' + (t.prochaine === null ? '<span class="froid">—</span>'
          : '<span class="' + (t.prochaine <= 1 ? "chaud" : "jour") + '">' + t.prochaine + " j</span>") + "</td>"
        + '<td class="num froid">' + t.declencheurs + "</td>"
        + '<td class="num ' + (vieille ? "chaud" : "froid") + '">'
        + (t.age_maj === null ? "—" : t.age_maj + " j") + "</td>"
        + '<td class="quoi">' + esc(t.attitude) + "</td></tr>";
      if (t.prochaine !== null)
        h += '<tr><td></td><td colspan="7" class="quoi">↳ ' + esc(t.prochaine_quoi) + "</td></tr>";
    });
    h += "</table>";
  });
  $("#tetes").innerHTML = h;
}

function rendreCalendrier(d) {
  const fen = d.echeances.filter((e) => e.jours <= 30);
  let h = '<h2>Les trente prochains jours <span class="compte">' + fen.length + "</span></h2>";
  if (!fen.length) { h += '<p class="vide">rien ne tombe</p>'; }
  else {
    h += "<table><tr><th>Quand</th><th>Quoi</th><th>Sur qui</th><th>Où</th><th></th></tr>";
    let dernier = null;
    fen.forEach((e) => {
      if (e.jours !== dernier) {
        dernier = e.jours;
        const q = e.jours < 0 ? "EN RETARD de " + (-e.jours) + " j"
          : e.jours === 0 ? "AUJOURD'HUI" : "dans " + e.jours + " j";
        h += '<tr><td colspan="5" class="' + (e.jours <= 0 ? "chaud" : "jour")
          + '" style="padding-top:.7rem">' + q + "</td></tr>";
      }
      h += '<tr><td class="fam">' + esc(e.famille) + "</td>"
        + '<td class="quoi">' + esc(e.quoi) + "</td>"
        + '<td class="froid">' + esc(e.qui || "") + "</td>"
        + '<td class="froid">' + esc(e.lieu || "") + "</td>"
        + '<td class="froid num">' + esc(e.etat || e.bloque || (e.importance ? "imp. " + e.importance : "")) + "</td></tr>";
    });
    h += "</table>";
  }
  const loin = d.echeances.filter((e) => e.jours > 30);
  if (loin.length) {
    h += '<h2>Plus loin <span class="compte">' + loin.length + "</span></h2><table>";
    loin.forEach((e) => {
      h += '<tr><td class="num jour">' + e.jours + ' j</td><td class="fam">' + esc(e.famille)
        + '</td><td class="quoi">' + esc(e.quoi) + '</td><td class="froid">' + esc(e.qui || "") + "</td></tr>";
    });
    h += "</table>";
  }
  $("#calendrier").innerHTML = h;
}

function rendreActivites(d) {
  let h = '<h2>Où en sont les choses <span class="compte">' + d.mains.length + "</span></h2>";
  if (!d.mains.length) { $("#mains").innerHTML = h + '<p class="vide">aucune main</p>'; return; }
  h += "<table><tr><th>Mesure</th><th class=\"num\">Valeur</th><th class=\"num\">Rythme</th>"
    + '<th class="num">Seuil dans</th><th>Ce que ça devient</th><th>Porteur</th>'
    + '<th>Mandat</th><th class="num">Rapport</th></tr>';
  d.mains.forEach((a) => {
    h += '<tr><td colspan="8" class="fam" style="padding-top:.7rem;color:var(--or)">'
      + esc(a.id) + ' — <span class="quoi">' + esc(a.quoi) + "</span></td></tr>";
    a.mesures.forEach((m) => {
      const court = m.jours_avant_seuil !== null && m.jours_avant_seuil <= 15;
      h += '<tr><td class="quoi">' + esc(m.quoi) + "</td>"
        + '<td class="num nom">' + esc(m.valeur) + " " + esc(m.unite) + "</td>"
        + '<td class="num froid">' + (m.par > 0 ? "+" : "") + m.par + " / j</td>"
        + '<td class="num ' + (court ? "chaud" : "jour") + '">'
        + (m.jours_avant_seuil === null ? '<span class="froid">—</span>' : m.jours_avant_seuil + " j") + "</td>"
        + '<td class="quoi">' + esc(m.seuil) + "</td>"
        + '<td class="' + (a.sans_porteur ? "chaud" : "froid") + '">' + esc(a.porteur) + "</td>"
        + '<td class="froid">' + esc(a.mandat || "— sans mandat") + "</td>"
        + '<td class="num ' + (a.rapport_age === null || a.rapport_age >= 3 ? "chaud" : "froid") + '">'
        + (a.dernier_rapport
          ? esc(a.dernier_rapport) + (a.rapport_age === null ? "" : " (" + a.rapport_age + " j)")
            + (a.rapport_a ? " → " + esc(a.rapport_a) : "")
          : "jamais dit") + "</td></tr>";
    });
    a.franchis.forEach((s) => {
      h += '<tr><td colspan="8" class="chaud">⚑ seuil franchi le ' + esc(s.le)
        + (s.promeut ? " → " + esc(s.promeut) : "") + " : " + esc(s.affaire) + "</td></tr>";
    });
  });
  h += "</table>";
  $("#mains").innerHTML = h;
}


function rendreTissu(d) {
  const t = d.tissu;
  const e = document.getElementById('tissu');
  if (!t) {
    e.innerHTML = '<h2>Le tissu</h2><div class="alertes"><div class="tiede">' +
      'Aucun tissu calcule. Lancer : python scripts/tisser.py --ecrire ' +
      'puis python scripts/evaluer.py --json</div></div>';
    return;
  }
  const age = t.calcule_il_y_a_s;
  const vieux = age > 3600;
  let h = '<h2>Le tissu</h2>';
  h += '<div class="alertes"><div class="' + (vieux ? 'tiede' : '') + '">' +
       t.noeuds + ' noeuds, ' + t.aretes + ' aretes — calcule il y a ' +
       (age < 90 ? age + ' s' : Math.round(age / 60) + ' min') +
       (vieux ? ' — A RECALCULER' : '') + '</div></div>';

  h += '<h2>Les goulots</h2><table><tr><th>demandes</th><th>noeud</th><th></th></tr>';
  (t.goulots || []).forEach(function (g) {
    h += '<tr><td>' + g.demandes + '</td><td>' + g.noeud + '</td><td>' +
         (g.quoi || '') + (g.sature ? ' <b>SATURE</b>' : '') + '</td></tr>';
  });
  h += '</table>';

  h += '<h2>Les pressions sans contre-arete</h2>';
  (t.desequilibres || []).forEach(function (x) {
    h += '<div class="alertes"><div class="grave">' + x.noeud + ' — ' +
         (x.quoi || '') + '</div><div>' + x.consommateurs +
         ' consommateurs, aucun producteur</div>';
    (x.candidats || []).forEach(function (c) {
      h += '<div class="tiede">candidat non relie : ' + c.id + ' — ' +
           (c.quoi || '') + '</div>';
    });
    h += '</div>';
  });

  h += '<h2>Ce qui ne tombe sur personne</h2><div class="alertes"><div>' +
       t.vacantes + ' actions a designer</div><div>' +
       (t.sourds || []).length + ' tetes sans declencheur</div><div>' +
       t.murs_sans_route + ' verrous d\'en face sans route de fuite</div></div>';

  const F = (t.force || []).filter(function (x) { return x.questions > 0; });
  if (F.length) {
    h += '<h2>La force narrative <span class="compte">' +
         F.reduce(function (a, x) { return a + x.questions; }, 0) +
         ' questions sur ' + F.length + ' têtes</span></h2>' +
         '<table><tr><th>force</th><th>questions</th><th>qui</th>' +
         '<th>creux</th><th>actions</th><th>critiques</th><th>goulot</th></tr>';
    F.forEach(function (x) {
      // La force ne crée pas de creux : un homme fort et occupé ne pense pas.
      // On montre donc les deux côte à côte — sans le temps, la force ne dit
      // que ce qu'il PÈSE, jamais ce qu'il va pouvoir en faire aujourd'hui.
      h += '<tr><td>' + x.force + '</td><td>' + x.questions + '</td><td>' +
           esc(x.qui) + '</td><td>' +
           (x.creux_total ? x.creux_total + ' min'
                          : '— ' + esc(x.hors_quartier || '')) + '</td><td>' +
           x.actions + '</td><td>' + (x.critiques || '') + '</td><td>' +
           (x.goulots || []).map(function (g) {
             return esc(g.split(':').pop()); }).join(' ') + '</td></tr>';
    });
    h += '</table>';
  }

  (t.critique || []).forEach(function (c) {
    h += '<h2>Le chemin critique — ' + c.maillons + ' maillons</h2><table>';
    c.chaine.forEach(function (x) {
      h += '<tr><td>' + x.id + '</td><td>' + (x.quoi || '') + '</td></tr>';
    });
    h += '</table>';
  });
  e.innerHTML = h;
}

// ---------------------------------------------------------------- graphe

  motifs: [], motifsParId: new Map(), motifsActifs: [], motifNoeuds: new Set(),
  motifAretes: new Set(), motifAncres: new Set(), motifEtiquettes: new Set(), ciblesMotif: new Map(), positionsAvantMotif: null, categorieMotifs: "decider",

    m.acteursLieux=unique(contexte);m.noeuds=unique(m.noeuds.concat(m.acteursLieux));m.aretes=unique(m.aretes.concat(liens));
    m.etiquettes=unique((m.etiquettes||m.ancres||[]).concat(m.acteursLieux));});

  diffuserImportance(motifs);
  motifs.sort((a,b)=>a.categorie.localeCompare(b.categorie)
    ||(a.categorie==="decider"?b.score-a.score
       :(ORDRE_TYPES_MOTIFS.indexOf(a.type)-ORDRE_TYPES_MOTIFS.indexOf(b.type))||b.score-a.score)
    ||a.titre.localeCompare(b.titre,"fr"));
  G.motifs=motifs;G.motifsParId=new Map(motifs.map(m=>[m.id,m]));
}

// ---------------------------------------------------------------------------
// L'IMPORTANCE NARRATIVE — deux champs qui se rencontrent
//
// Un tissu n'a pas de centre en lui-même : il en a un parce qu'un joueur est
// assis quelque part. On diffuse donc DEUX fois sur le même graphe, et c'est
// leur produit qui classe :
//
//   atteinte — part émise par le seul siège principal, celui du PJ.
//              « à quelle distance du joueur ? »
//   charge   — part des nœuds qui ancrent l'un des SEPT motifs de Décider,
//              chacun pesant sa propre masse. « quel poids de problème ? »
//
// Un problème loin du joueur ne remonte pas ; un nœud près du joueur sans
// problème ne remonte pas. Ce qui remonte, c'est un problème QUI LE TOUCHE —
// et c'est la seule importance que ce graphe sache porter sans qu'on lui
// ajoute un jugement du dehors. Rien d'autre n'entre dans le calcul : ni le
// degré, ni l'ordre des familles, ni une pondération écrite à la main.
//
// Les relations ne donnent aucun poids : une adjacency existe ou non. Les
// types de nœuds règlent le transit ; les personnes absorbent l'énergie afin
// qu'elle ne traverse pas l'une d'elles pour en rendre une autre importante.
// ---------------------------------------------------------------------------
const TYPES_IMPORTANCE = ["goulot","desequilibre","critique","tension",
  "vacant","titulaire_inconnu","bifurcation"];
// Les types ne donnent aucun bonus numerique. Ils disent seulement si l'energie
// peut continuer. Une personne la recoit et l'arrete ; le PJ fait exception
// parce qu'il est la source. Les impasses explicites ne propagent rien non plus.
// LA PHYSIQUE NE SE REDEFINIT PLUS ICI. Cette page en tenait sa propre copie,
// et cette copie avait derive : la meme liste que le Python, MOINS `personne`.
// Une onde qu'un homme absorbait au lieu de la passer — alors que la doctrine
// dit qu'une nouvelle ne voyage jamais autrement que par des gens. Mesure sur
// le tissu du 129.4.3 depuis pers:rhaenyra : 2159 noeuds atteignables avec le
// relais contre 1647 sans, 80 personnes sur 114 contre 67. La regie annoncait
// donc une diffusion qui n'etait pas celle qui elit les acteurs.
// Source unique : scripts/noyau/diffusion.json, servi sous `graphe.physique`.
let GENRES_RELAIS = new Set(), AMORTISSEMENT = .85, TOURS_DIFFUSION = 40;
function adopterPhysique(p) {
  // Pas de defaut silencieux : sans le fichier, on le DIT. Un repli muet est
  // exactement le mecanisme qu'on vient de retirer.
  if (!p || !Array.isArray(p.genres_relais) || !p.genres_relais.length) {
    console.error("physique de diffusion absente — scripts/noyau/diffusion.json", p);
    G.physiqueAbsente = true; return;
  }
  GENRES_RELAIS = new Set(p.genres_relais);
  AMORTISSEMENT = Number(p.amortissement);
  TOURS_DIFFUSION = Number(p.tours);
  G.physiqueAbsente = false;
}
// Le direct n'est pas une coloration de composante connexe. Une impulsion du
// PJ perd 15 % a chaque relais et partage le reste entre ses voisins. Sous
// 0,3 % de l'impulsion initiale elle n'est plus un front discernable.
const SEUIL_FLUX_DIRECT = .003;
// Calibration du direct de test. `jours_de_pr` reste la seule distance
// geographique disponible : on le convertit en 40 km par jour de route, puis
// on fait voler le corbeau a 40 km/h. Aucun champ d'etat n'est ajoute.
const COOLDOWN_TEST_JOURS = 5/1440;
const KM_PAR_JOUR_DE_ROUTE = 40;
const VITESSE_CORBEAU_KMH = 40;

function diffuser(sources, adj, journal) {
  let total = 0; sources.forEach((v) => { total += v; });
  if (!total) return new Map();
  const s = new Map(); sources.forEach((v, k) => s.set(k, v / total));
  let x = new Map(s);
  if (journal) journal.push(new Map(x));
  for (let t = 0; t < TOURS_DIFFUSION; t++) {
    const y = new Map();
    let retenue = 0;
    x.forEach((v, id) => {
      const l = adj.get(id), n = G.parId.get(id);
      // Une source emet meme si son type est normalement terminal. Ailleurs,
      // personnes, vacants, pendants, unites et rien absorbent sans relayer.
      if (!l || !l.liens.length || (!s.has(id) && !GENRES_RELAIS.has(n && n.genre))) {
        retenue += v; return;
      }
      const part = AMORTISSEMENT * v / l.liens.length;
      l.liens.forEach((autre) => y.set(autre, (y.get(autre) || 0) + part));
    });
    // La masse absorbee retourne aux sources : total conserve, aucune fuite
    // artificielle aux extremites du graphe.
    s.forEach((v, k) => y.set(k, (y.get(k) || 0)
      + ((1 - AMORTISSEMENT) + AMORTISSEMENT * retenue) * v));
    x = y;
    if (journal) journal.push(new Map(x));
  }
  return x;
}

// Le classement reste purement topologique. Ce second calcul ne change aucun
// poids : il date seulement l'arrivée de l'énergie chez les acteurs.
// Priorités de temps :
//   1. délai explicite de la route (un pli sait combien de jours il voyage) ;
//   2. chemin de salles calculé par presence.py, en minutes ;
//   3. route connue via Port-Réal, à partir de `lieux.jours_de_pr` ;
//   4. inconnu — jamais remplacé par un zéro mensonger.
function calendrierImportance(emission) {
  const presence = ((((G.d||{}).tissu||{}).presence||{}).acteurs||[]);
  const parPresence = new Map(presence.map((p)=>["pers:"+p.id,p]));
  const lieux = new Map(G.noeuds.filter((n)=>n.genre==="lieu")
    .map((n)=>[n.id.replace(/^lieu:/,""),n]));
  const sourceId = emission.keys().next().value, source = G.parId.get(sourceId);
  const adjTemps = new Map(G.noeuds.map((n)=>[n.id,[]]));
  const ajouterArc=(de,vers,a)=>{const lot=adjTemps.get(de);if(lot)lot.push({id:vers,a});};
  G.aretes.forEach((a)=>{
    if(a.flou||a.virtuel||a.de===a.vers)return;
    const de=a.de,vers=a.vers;
    // Aucune orientation semantique n'est deduite de la nature du lien : le
    // type du noeud decide seulement s'il relaie ou absorbe. Le graphe reste
    // parcouru dans les deux sens ; c'est le decay, pas une liste de relations,
    // qui finit le front.
    ajouterArc(de.id,vers.id,a);
    ajouterArc(vers.id,de.id,a);
  });

  function distanceActeur(n) {
    const p=parPresence.get(n.id);
    if(p&&Number.isFinite(p.distance_joueur_minutes))
      return {jours:p.distance_joueur_minutes/1440,source:"chemin de salles"};
    if(!source||!source.lieu_id||!n.lieu_id)return null;
    if(source.lieu_id===n.lieu_id)
      return {jours:0,source:"même lieu · chemin interne inconnu"};
    const a=lieux.get(source.lieu_id),b=lieux.get(n.lieu_id);
    if(!a||!b||!Number.isFinite(a.jours_de_pr)||!Number.isFinite(b.jours_de_pr))return null;
    // `jours_de_pr` est radial, pas une matrice de distances. La seule route
    // démontrable entre deux rayons non nuls est celle qui repasse par PR.
    const joursRoute=a.jours_de_pr===0||b.jours_de_pr===0
      ? Math.abs(a.jours_de_pr-b.jours_de_pr)
      : a.jours_de_pr+b.jours_de_pr;
    return {jours:(joursRoute*KM_PAR_JOUR_DE_ROUTE/VITESSE_CORBEAU_KMH)/24,
      source:"corbeau 40 km/h · distance via Port-Réal"};
  }
  function cooldown(n) {
    const actives=G.aretes.filter((a)=>a.nature==="poursuit"&&a.de===n
      &&a.vers.genre==="etape"&&a.vers.etat==="en-cours").map((a)=>a.vers);
    if(!actives.length)return {jours:0,inconnu:false,etapes:0};
    const valeurs=actives.map((e)=>e.jours_restants).filter(Number.isFinite);
    // Le premier travail qui se termine libère le premier créneau. On prend
    // donc le minimum, jamais la somme (les étapes peuvent être parallèles).
    const reel=valeurs.length?Math.max(0,Math.min(...valeurs)):null;
    // En test, on conserve l'ordre des disponibilites mais on ne bloque pas
    // l'observation pendant une journee entiere : cinq minutes au maximum.
    return {jours:reel==null?null:Math.min(reel,COOLDOWN_TEST_JOURS),
      inconnu:valeurs.length!==actives.length,etapes:actives.length};
  }

  // Dijkstra sur (jours, sauts). Les sauts ne deviennent jamais des jours :
  // ils ne servent qu'à départager deux arrivées physiques simultanées.
  const meilleur=new Map(), file=[];
  emission.forEach((_v,id)=>{meilleur.set(id,{jours:0,sauts:0,energie:1});
    file.push({id,jours:0,sauts:0,energie:1});});
  while(file.length){
    file.sort((a,b)=>b.jours-a.jours||b.sauts-a.sauts);const ici=file.pop();
    const connu=meilleur.get(ici.id);if(!connu||connu.jours!==ici.jours||connu.sauts!==ici.sauts)continue;
    const n=G.parId.get(ici.id);
    if(!n||(!emission.has(ici.id)&&!GENRES_RELAIS.has(n.genre)))continue;
    const sorties=adjTemps.get(ici.id)||[];
    // Conservation locale : 15 % sont absorbes a chaque relais et le reste
    // se partage egalement entre les sorties causales effectivement ouvertes.
    const energieSortie=(ici.energie||0)*AMORTISSEMENT/Math.max(1,sorties.length);
    if(energieSortie<SEUIL_FLUX_DIRECT)continue;
    for(const pas of sorties){
      const cible=G.parId.get(pas.id);if(!cible)continue;
      let ajout=0,sourceTemps="structure instantanée";
      const route=pas.a.route&&typeof pas.a.route==="object"?pas.a.route:null;
      if(route&&String(route.canal||"").toLowerCase()==="corbeau"
          && cible.genre==="personne"&&!emission.has(cible.id)){
        const physique=distanceActeur(cible);if(!physique){cible.diffusion_inconnue=true;continue;}
        ajout=physique.jours;sourceTemps=physique.source;
      } else if(route&&String(route.canal||"").toLowerCase()==="corbeau"){
        // Le delai historique etait chiffre en jours de route. La distance du
        // destinataire sera appliquee une seule fois, a l'arrivee sur l'acteur.
        ajout=0;sourceTemps="corbeau · distance au destinataire";
      } else if(route&&Number.isFinite(route.delai_jours)&&route.delai_jours>0){
        ajout=route.delai_jours;sourceTemps="route datée";
      } else if(cible.genre==="personne"&&!emission.has(cible.id)) {
        const physique=distanceActeur(cible);if(!physique){cible.diffusion_inconnue=true;continue;}
        ajout=physique.jours;sourceTemps=physique.source;
      }
      const cand={jours:ici.jours+ajout,sauts:ici.sauts+1,energie:energieSortie,source:sourceTemps,
        precedent:ici.id,arete:pas.a.id};
      const avant=meilleur.get(cible.id);
      if(!avant||cand.jours<avant.jours||(cand.jours===avant.jours&&
          (cand.sauts<avant.sauts||(cand.sauts===avant.sauts&&cand.energie>avant.energie)))){
        meilleur.set(cible.id,cand);file.push({id:cible.id,jours:cand.jours,
          sauts:cand.sauts,energie:cand.energie});
      }
    }
  }
  let horizon=0,inconnus=0;
  G.aretes.forEach((a)=>{a.diffusion_active=false;a.diffusion_de=null;a.diffusion_vers=null;});
  G.noeuds.forEach((n)=>{
    const m=meilleur.get(n.id);n.reception_jours=m?m.jours:null;n.source_delai=m&&m.source;
    n.diffusion_sauts=m?m.sauts:null;
    n.diffusion_energie=m?m.energie:0;
    n.diffusion_inconnue=!m;n.cooldown_jours=0;n.cooldown_inconnu=false;n.consomme_jours=m?m.jours:null;
    if(n.genre==="personne"&&!emission.has(n.id)){
      const c=cooldown(n);n.cooldown_jours=c.jours;n.cooldown_inconnu=c.inconnu;n.etapes_actives=c.etapes;
      n.peut_consommer=n.etat==="actif"&&!['prisonnier','otage'].includes(n.condition);
      // Une étape active sans horloge interdit de prétendre connaître la
      // disponibilité. L'énergie peut être reçue, mais sa consommation reste
      // non datable jusqu'à correction de cette étape.
      n.consomme_jours=m&&n.peut_consommer&&!c.inconnu&&c.jours!=null?m.jours+c.jours:null;
    }
    if(n.consomme_jours!=null)horizon=Math.max(horizon,n.consomme_jours);
    else if(n.genre==="personne"&&!emission.has(n.id))inconnus++;
    if(m&&m.arete){const a=G.parArete.get(m.arete);if(a){a.diffusion_active=true;
      a.diffusion_de=m.precedent;a.diffusion_vers=n.id;}}
  });
  G.dureeDiffusionJours=Math.max(horizon,1/1440);G.inconnusDiffusion=inconnus;
}

function minuteAbsolueHorloge(d) {
  if(!d||d.annee==null||d.lune==null||d.jour==null)return null;
  return (((d.annee*12+(d.lune-1))*30+(d.jour-1))*1440)+(Number(d.minute)||0);
}
function horlogeLisible(id,d) {
  if(!d)return id||"horloge absente";
  const h=Math.floor((d.minute||0)/60),m=(d.minute||0)%60;
  const siege=((G.data||{}).sieges||[]).find((s)=>s.id===id);
  return ((siege&&siege.nom)||id)+" · "+d.jour+"e "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
// L'origine est l'horloge du PJ émetteur. Le présent est le front occupé le
// plus avancé. Tant que ce front n'est pas réécrit, le temps continue à la
// vitesse murale : une seconde réelle = une seconde dans le monde.
function synchroniserHorloges(horloges) {
  const sieges=((G.data||{}).sieges||[]), principal=sieges.find((s)=>s.role==="principal");
  const sourceId=principal&&principal.id, source=sourceId&&horloges&&horloges[sourceId];
  const candidats=(sieges.length?sieges.map((s)=>s.id):Object.keys(horloges||{}))
    .map((id)=>({id,date:horloges&&horloges[id],minute:minuteAbsolueHorloge(horloges&&horloges[id])}))
    .filter((x)=>x.minute!=null).sort((a,b)=>b.minute-a.minute);
  const active=candidats[0], sm=minuteAbsolueHorloge(source);
  if(sm==null||!active){
    if(G.tempsBaseMur==null){G.tempsBaseJours=G.tempsDiffusion||0;G.tempsBaseMur=performance.now();}
    G.horlogeSource=sourceId?{id:sourceId,date:source}:null;G.horlogeActive=null;return;
  }
  const cle=sm+"|"+active.minute;
  if(cle!==G.horlogeCle){
    G.horlogeCle=cle;G.tempsBaseJours=Math.max(0,(active.minute-sm)/1440);
    G.tempsBaseMur=performance.now();
  }
  G.horlogeSource={id:sourceId,date:source};G.horlogeActive={id:active.id,date:active.date};
}
function tempsImportanceDirect() {
  if(G.tempsBaseMur==null)return G.tempsBaseJours||0;
  return (G.tempsBaseJours||0)+(performance.now()-G.tempsBaseMur)/86400000;
}
function dureePrecise(jours) {
  if(jours==null||!Number.isFinite(jours))return "?";
  let s=Math.max(0,Math.floor(jours*86400)),j=Math.floor(s/86400);s-=j*86400;
  const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60),sec=s-m*60;
  return (j?j+" j ":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function diffuserImportance(motifs) {
  // Le graphe est parcouru dans les deux sens, mais seules les aretes resolues
  // conduisent. Deux noeuds voisins comptent une fois, quels que soient le nom
  // et le nombre de liens projetes entre eux : aucune semantique d'arete cachee.
  const adj = new Map(G.noeuds.map((n) => [n.id, { liens: [] }]));
  const paires = new Set();
  G.aretes.forEach((a) => {
    if (a.flou || a.virtuel || a.de.id === a.vers.id) return;
    const A = adj.get(a.de.id), B = adj.get(a.vers.id);
    if (!A || !B) return;
    const cle = a.de.id < a.vers.id
      ? a.de.id + "\u0000" + a.vers.id : a.vers.id + "\u0000" + a.de.id;
    if (paires.has(cle)) return;
    paires.add(cle); A.liens.push(a.vers.id); B.liens.push(a.de.id);
  });

  const emission = new Map();
  ((G.data || {}).sieges || []).forEach((s) => {
    const id = "pers:" + s.id;
    if (s.role === "principal" && adj.has(id)) emission.set(id, 1);
  });
  G.emetteurs = new Set(emission.keys());

  const charge = new Map();
  motifs.forEach((m) => {
    if (!TYPES_IMPORTANCE.includes(m.type)) return;
    const ancres = (m.ancres && m.ancres.length ? m.ancres : m.noeuds).filter((id) => adj.has(id));
    if (!ancres.length) return;
    // Masse comprimée. Un goulot compte 143 demandes, une action à désigner
    // en compte 1 : à masse brute, les douze goulots écrasent les cinquante
    // et une vacantes et l'atteinte ne tranche plus rien. Le log garde
    // l'ordre des masses et ramène l'écart à ce que la distance au joueur
    // peut encore renverser — ce qui est tout l'objet du calcul.
    const masse = (1 + Math.log1p(Math.max(1, m.score || 1))) / ancres.length;
    ancres.forEach((id) => charge.set(id, (charge.get(id) || 0) + masse));
  });

  // Le journal garde chaque tour de la diffusion depuis les sièges : c'est
  // lui que la lentille Importance rejoue, tour par tour, avec les valeurs
  // réellement calculées — jamais une animation décorative par-dessus.
  const journal = [];
  const atteinte = diffuser(emission, adj, journal), pression = diffuser(charge, adj);
  G.vagues = journal; G.toursDiffusion = journal.length;
  const pic = (m) => Math.max(1e-12, ...m.values());
  const mA = pic(atteinte), mP = pic(pression);
  let mI = 1e-12;
  G.noeuds.forEach((n) => {
    n.atteinte = (atteinte.get(n.id) || 0) / mA;
    n.charge = (pression.get(n.id) || 0) / mP;
    // Moyenne geometrique : etre proche du PJ sans porter de motif, ou porter
    // un motif sans etre atteignable depuis lui, ne suffit jamais a remonter.
    // Les deux champs sont symetriques et aucun type ne recoit de prime.
    n.importance = emission.size ? Math.sqrt(n.atteinte * n.charge) : n.charge;
    if (n.importance > mI) mI = n.importance;
  });
  G.noeuds.forEach((n) => { n.importance /= mI; });

  calendrierImportance(emission);
  G.noeuds.forEach((n) => {
    n.arrivee = n.reception_jours == null ? -1 : n.reception_jours;
    n.vpic = 1;
  });

  // Le compte local devient la MASSE (il a servi à charger la diffusion) et
  // reste lisible ; le score affiché, lui, est l'importance.
  motifs.forEach((m) => {
    if (!TYPES_IMPORTANCE.includes(m.type)) return;
    const ancres = m.ancres && m.ancres.length ? m.ancres : m.noeuds;
    let v = 0;
    ancres.forEach((id) => { const n = G.parId.get(id); if (n && n.importance > v) v = n.importance; });
    m.masse = m.score;
    m.score = Math.round(v * 1000);
  });
}

function rendreListeMotifs() {

  const q=G.filtreMotifs.toLowerCase();const ms=G.motifs.filter(m=>m.categorie===G.categorieMotifs
    &&(G.lentille!=="importance"||TYPES_IMPORTANCE.includes(m.type))

  if(!ms.length){e.innerHTML='<div class="motifs-vide">Aucun motif dans cette liste.</div>';return;}

    if(lot.length>40)h+='<div class="motifs-note">'+(lot.length-40)+' autres — filtrez pour les atteindre</div>';h+='</details>';});e.innerHTML=h;
  e.querySelectorAll(".motif-ligne").forEach(b=>b.onclick=(ev)=>activerMotif(b.dataset.motif,ev.shiftKey||ev.ctrlKey||ev.metaKey));

  const eff=document.getElementById("motifs-effacer");if(eff)eff.classList.toggle("allume",!!G.motifsActifs.length);

    if(n){G.glisse=n;inspecterGraphe(n);}else{G.panoramique={x:ev.clientX,y:ev.clientY,tx:G.tx,ty:G.ty};const a=aretePres(p);if(a)inspecterGraphe(a);} };
  c.onpointermove=(ev)=>{const p=mondeDepuisEvenement(ev);if(G.glisse){G.glisse.x=p.x;G.glisse.y=p.y;G.glisse.vx=0;G.glisse.vy=0;reveillerGraphe(.12);return;}
    if(G.panoramique){G.tx=G.panoramique.tx+ev.clientX-G.panoramique.x;G.ty=G.panoramique.ty+ev.clientY-G.panoramique.y;dessinerGraphe();return;}

const A = { chargee: false, activations: [],

function heureActivation(x) {
  if (!x) return "heure inconnue";
  const d = new Date(x);
  if (Number.isNaN(d.getTime())) return String(x);
  return d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function dureeActivation(ms) {
  if (ms == null || !Number.isFinite(Number(ms))) return "durée inconnue";
  const s = Number(ms) / 1000;
  return (s < 60 ? s.toFixed(1) + " s" : Math.floor(s / 60) + " min " +
    Math.round(s % 60) + " s");
}
function dureeMonde(secondes) {
  if (secondes == null || !Number.isFinite(Number(secondes))) return "durée monde inconnue";
  const total = Math.max(0, Math.round(Number(secondes)));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  return (h ? h + " h " : "") + (m ? m + " min " : "") +
    ((!h && !m) || s ? s + " s" : "");
}
function energieActivation(x) {
  const reserve = x.budget == null ? "?" : x.budget;
  const depense = x.depense == null ? "?" : x.depense;
  const rendue = x.restitue == null ? "?" : x.restitue;
  return "⚡ " + reserve + " réservée · −" + depense + " · +" + rendue;
}
function apercuEvenement(ev) {
  if (!ev || typeof ev !== "object") return String(ev || "");
  if (ev.contenu) return String(ev.contenu);
  if (typeof ev.content === "string") return ev.content;
  const m = ev.message || {};
  if (typeof m.content === "string") return m.content;
  if (Array.isArray(m.content)) {
    return m.content.map((b) => b && (b.text || b.type || b.name)).filter(Boolean).join(" · ");
  }
  if (ev.evenement === "cli.resultat") return ev.erreur ? "erreur" : "appel terminé";
  return "";
}
function rendreEvenements(liste, journal) {
  if (!(liste || []).length) return '<div class="act-erreur">Aucun événement conservé.</div>';
  return liste.map((ev, i) => {
    const genre = journal ? (ev.evenement || "événement") :
      ((ev.type || "événement") + (ev.operation ? " / " + ev.operation : ""));
    const moment = ev.timestamp || ev.a || "";
    const apercu = apercuEvenement(ev).replace(/\s+/g, " ").trim().slice(0, 180);
    return '<details class="act-event"><summary><span class="genre">' +
      esc(String(i + 1).padStart(3, "0") + " · " + genre) + '</span><span class="moment">' +
      esc(moment ? heureActivation(moment) : (ev.t_s == null ? "" : "+" + ev.t_s + " s")) +
      '</span><span class="apercu">' + esc(apercu) + '</span></summary><pre>' +
      esc(JSON.stringify(ev, null, 2)) + '</pre></details>';
  }).join("");
}

function extraireJsonMarkdown(texte) {
  let s=String(texte||'').trim();
  const bloc=s.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
  if(bloc)s=bloc[1].trim();
  try{return JSON.parse(s);}catch(_e){return null;}
}
function texteMarkdown(texte) {
  return esc(String(texte)).replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
}
function rendreJsonMarkdown(valeur, profondeur=0) {
  if(valeur===null)return '<span class="md-null">nul</span>';
  if(Array.isArray(valeur))return valeur.length
    ?'<ol>'+valeur.map(x=>'<li>'+rendreJsonMarkdown(x,profondeur+1)+'</li>').join('')+'</ol>'
    :'<span class="md-null">liste vide</span>';
  if(typeof valeur==='object'){
    const entrees=Object.entries(valeur);
    if(!entrees.length)return '<span class="md-null">objet vide</span>';
    return '<div class="md-objet">'+entrees.map(([cle,v])=>
      '<section class="md-champ"><h4>'+esc(cle.replaceAll('_',' '))+'</h4>'+
      rendreJsonMarkdown(v,profondeur+1)+'</section>').join('')+'</div>';
  }
  if(typeof valeur==='string')return '<p>'+texteMarkdown(valeur)+'</p>';
  return '<code>'+esc(String(valeur))+'</code>';
}
function reponseEnMarkdown(texte) {
  const json=extraireJsonMarkdown(texte);
  if(json!==null)return '<div class="act-json-md">'+rendreJsonMarkdown(json)+'</div>';
  return '<pre>'+esc(String(texte||'Non conservée.'))+'</pre>';
}

  e.innerHTML = '<div class="act-shell"><div class="act-head"><h2>Activations</h2>' +
    '<p>Une exécution réelle par ligne · les gros journaux ne sont lus qu’au clic.</p>' +
    '<div class="act-actions"><button id="act-copier" type="button" disabled ' +
    'title="Sélectionnez une activation" aria-label="Copier le contenu de l’activation sélectionnée">CC</button>' +
    '<button id="act-relire">Relire</button></div></div><div class="act-corps"><aside class="act-mj" id="act-mj">' +
    '<div class="act-vide">Lecture du fil du MJ actif…</div></aside><div class="act-liste">' +
    liste + '</div><div class="act-detail" id="act-detail"><div class="act-vide">' +
    (A.activations.length ? 'Cliquez une archive pour lire l’appel entier.' : 'Aucune archive d’activation.') +
    '</div></div></div></div>';
  document.getElementById("act-relire").onclick = () => chargerActivations(true);
  document.getElementById("act-copier").onclick = copierActivationSelectionnee;
  e.querySelectorAll("[data-activation-index]").forEach((b) => {
    b.onclick = () => ouvrirActivation(A.activations[Number(b.dataset.activationIndex)]);
  });
}

function actualiserBoutonCopieActivation() {
  const bouton = document.getElementById("act-copier");
  const detail = document.getElementById("act-detail");
  if (!bouton) return;
  const pret = Boolean(A.selection && detail && detail.dataset.activationId === A.selection);
  bouton.disabled = !pret;
  bouton.title = pret ? "Copier le contenu de l’activation sélectionnée" :
    "Sélectionnez une activation";
}

async function copierActivationSelectionnee() {
  const bouton = document.getElementById("act-copier");
  const detail = document.getElementById("act-detail");
  const activation = A.activations.find((x) => x.id === A.selection);
  if (!bouton || !detail || !activation || detail.dataset.activationId !== activation.id) return;
  const libelle = bouton.textContent;
  bouton.classList.remove("copie", "erreur");
  try {
    const texte = texteCopiable(detail);
    if (!texte) throw new Error("Le détail de l’activation est vide.");
    await ecrirePressePapiers(texte);
    bouton.textContent = "Copié ✓";
    bouton.classList.add("copie");
  } catch (erreur) {
    console.error("Copie de l’activation impossible", erreur);
    bouton.textContent = "Erreur";
    bouton.classList.add("erreur");
  } finally {
    setTimeout(() => {
      bouton.textContent = libelle;
      bouton.classList.remove("copie", "erreur");
    }, 1800);
  }
}

async function chargerActivations(forcer) {
  if (A.chargee && !forcer) return;
  const e = document.getElementById("activations");
  e.innerHTML = '<div class="act-vide">Lecture du journal d’activation…</div>';
  try {
    const r = await fetch("/admin/activations", { cache: "no-store" });
    const d = await r.json();
    if (!r.ok || d.erreur) throw new Error(d.erreur || ("HTTP " + r.status));
    A.activations = d.activations || [];
    A.chargee = true;
    const selection = A.selection && A.activations.find((x) => x.id === A.selection);
    rendreListeActivations();
    actualiserFilMjActif(true);
    if (selection) ouvrirActivation(selection);
  } catch (erreur) {
    e.innerHTML = '<div class="act-erreur">Activations illisibles : ' + esc(erreur.message) + '</div>';
  }
}

async function ouvrirActivation(x) {
  if (!x) return;
  A.selection = x.id;
  document.querySelectorAll(".act-ligne").forEach((b) => b.classList.toggle("actif",
    A.activations[Number(b.dataset.activationIndex)].id === x.id));
  const e = document.getElementById("act-detail");
  delete e.dataset.activationId;
  e.innerHTML = '<div class="act-vide">Ouverture du prompt et du thread…</div>';
  actualiserBoutonCopieActivation();
  try {
    let d = A.details.get(x.id);
    if (!d) {
      const r = await fetch("/admin/activations/" + encodeURIComponent(x.session), { cache: "no-store" });
      d = await r.json();
      if (!r.ok || d.erreur) throw new Error(d.erreur || ("HTTP " + r.status));
      A.details.set(x.id, d);
    }
    if (A.selection !== x.id) return;
    rendreDetailActivation(x, d);
  } catch (erreur) {
    e.innerHTML = '<div class="act-erreur">Détail illisible : ' + esc(erreur.message) + '</div>';
    actualiserBoutonCopieActivation();
  }
}

function rendreDetailActivation(x, d) {
  const e = document.getElementById("act-detail");
  const activation = (d.rapport || {}).activation || {};
  const activites = activation.activites || [];
  const meta = (d.rapport || {})._activation || {};
  const usage = ((d.execution || {}).usage) || meta.usage || {};
  const energie = x.energie_avant == null || x.energie_apres == null
    ? energieActivation(x)
    : "⚡ " + x.energie_avant + " → " + x.energie_apres +
      " (−" + x.depense + ", +" + x.restitue + ")";
  const cout = x.cout_usd == null ? "coût inconnu" : "$" + Number(x.cout_usd).toFixed(4);
  let actes = activites.map((a, i) => {
    const temps = a.temps || {};
    const touchees = (a.sources_touchees || []).map((s) =>
      typeof s === 'string' ? s : (s.ref || '?') + (s.mode ? ' [' + s.mode + ']' : '')
    );
    const mobilisees = (a.sources_mobilisees || []).map((s) =>
      typeof s === 'string' ? s : (s.ref || '?') + (s.mode ? ' [' + s.mode + ']' : '')
    );
    const chemin = (a.chemin_execution || []).map((s) =>
      esc((s.de || '?') + ' —' + (s.relation || '?') + ' / ' +
        (s.duree_s == null ? '?' : s.duree_s) + ' s→ ' + (s.vers || '?'))
    ).join('<br>');
    const resultats = (a.resultats_produits || []).map((r) =>
      '<p><span class="froid">' + esc((r.type || 'résultat') + ' · ' + (r.id || '?')) +
      '</span><br>' + esc(typeof r.apres === 'string' ? r.apres :
        JSON.stringify(r.apres == null ? null : r.apres)) +
      ((r.source_refs || []).length ? '<br><span class="froid">depuis · ' +
        esc(r.source_refs.join(', ')) + '</span>' : '') + '</p>'
    ).join('');
    return '<div class="act-activite"><header><span>' +
      esc((a.ordre || i + 1) + '. ' + (a.quoi || 'activité')) + '</span><b>⚡ ' +
      esc(a.cout_energie == null ? '?' : a.cout_energie) + '</b></header>' +
      (temps.debut_s == null ? '' : '<p><span class="froid">temps · </span>+' +
        esc(temps.debut_s) + ' → +' + esc(temps.fin_s) + ' · ' +
        esc(temps.duree_s) + ' s</p>') +
      (chemin ? '<p><span class="froid">chemin · </span><br>' + chemin + '</p>' : '') +
      (touchees.length ? '<p><span class="froid">sources touchées · </span>' +
        esc(touchees.join(', ')) + '</p>' :
        (a.source && !mobilisees.length ? '<p><span class="froid">sources · </span>' +
          esc(a.source) + '</p>' : '')) +
      (mobilisees.length ? '<p><span class="froid">sources mobilisées · </span>' +
        esc(mobilisees.join(', ')) + '</p>' : '') +
      (resultats || '<p>' + esc(a.resultat || '') + '</p>') +
      (a.blocage ? '<p><span class="grave">blocage · </span>' +
        esc(typeof a.blocage === 'string' ? a.blocage : JSON.stringify(a.blocage)) + '</p>' : '') +
      '</div>';
  }).join("");
  if (!actes) actes = '<div class="act-erreur">Aucune activité produite.</div>';
  const pnj = d.pnj || null;
  const legacy = d.architecture === 'legacy_direct' || !pnj;
  const blocPnj = pnj ?
    '<div class="act-pipeline-titre acteur">Acteur · ' + esc(x.nom) +
      ' — ce fil ne reçoit pas le système du narrateur</div>' +
    '<details class="act-bloc"><summary>4 · System acteur · ' +
      esc(meta.system_prompt_pnj_source || 'source non conservée') + '</summary><pre>' +
      esc(pnj.system_prompt || 'Non conservé.') + '</pre></details>' +
    '<details class="act-bloc"><summary>5 · Appel adressé à l’acteur</summary><pre>' +
      esc(pnj.message || 'Non conservé.') + '</pre></details>' +
    '<details class="act-bloc" open><summary>6 · Fil propre de l’acteur · ' +
      (pnj.thread || []).length + ' entrées</summary>' +
      rendreEvenements(pnj.thread || [], false) + '</details>' +
    '<details class="act-bloc" open><summary>7 · Tentative rendue par l’acteur</summary>' +
      reponseEnMarkdown(JSON.stringify(pnj.tentative || {}, null, 2)) + '</details>' : '';
  const blocReprise = pnj ?
    '<div class="act-pipeline-titre">Narrateur local · reprise après la tentative</div>' +
    '<details class="act-bloc"><summary>8 · Contrat d’arbitrage transmis au narrateur</summary><pre>' +
      esc(meta.message_resolution || 'Non conservé.') + '</pre></details>' : '';
  const numeroReponse = pnj ? 9 : 4;
  const avertissementLegacy = legacy ? '<div class="act-erreur">Historique legacy : cet appel direct au PNJ précède le narrateur local. Il est conservé pour audit, pas présenté comme le pipeline actuel.</div>' : '';
  const etiquetteSysteme = legacy ? '1 · System PNJ legacy' : '1 · System narrateur local';
  const etiquettePrompt = legacy ? '2 · Prompt direct legacy' : '2 · Prompt narrateur · réveil local';
  const etiquetteThread = legacy ? '3 · Thread PNJ legacy complet' : '3 · Thread narrateur complet';
  const etiquetteReponse = legacy ? '4 · Réponse PNJ legacy' : numeroReponse + ' · Réponse finale du narrateur';
  e.innerHTML = '<div class="act-titre"><div><h3>' + esc(x.nom) + '</h3><div>' +
    esc(x.tache || x.tache_id) + '</div></div><div class="act-id">' + esc(x.session) +
    '</div></div><div class="act-badges"><span class="act-badge"><b>' +
    esc(heureActivation(x.termine_le)) + '</b></span><span class="act-badge"><b>' +
    esc(dureeMonde(x.duree_monde_secondes)) + '</b></span>' +
    '<span class="act-badge"><b>calcul ' + esc(dureeActivation(x.duree_ms)) +
    '</b></span><span class="act-badge energie"><b>' +
    esc(energie) + '</b></span><span class="act-badge">issue · <b>' + esc(x.issue) +
    '</b></span><span class="act-badge">modèle · <b>' + esc(x.modele) + '</b></span>' +
    '<span class="act-badge">effort · <b>' + esc(x.effort) + '</b></span>' +
    '<span class="act-badge">' + esc(cout) + '</span><span class="act-badge">tokens · <b>' +
    esc((usage.input_tokens == null ? '?' : usage.input_tokens) + ' → ' +
      (usage.output_tokens == null ? '?' : usage.output_tokens)) + '</b></span></div>' +
    avertissementLegacy +
    (legacy ? '' : '<div class="act-pipeline-titre">Narrateur local · fil d’arbitrage</div>') +
    '<details class="act-bloc"><summary>' + etiquetteSysteme + ' · ' +
    esc(meta.system_prompt_source || 'source non conservée') + '</summary><pre>' +
    esc(d.system_prompt || 'Non conservée.') + '</pre></details>' +
    '<details class="act-bloc"><summary>' + etiquettePrompt + '</summary><pre>' +
    esc(d.message || 'Non conservé pour cette activation.') + '</pre></details>' +
    '<details class="act-bloc" open><summary>' + etiquetteThread + ' · ' + (d.thread || []).length +
    ' entrées</summary>' + rendreEvenements(d.thread || [], false) + '</details>' +
    blocPnj +
    blocReprise +
    '<details class="act-bloc" open><summary>' + etiquetteReponse + '</summary>' +
    reponseEnMarkdown(d.reponse || 'Non conservée pour cette activation.') + '</details>' +
    '<details class="act-bloc"><summary>Journal temps réel · ' + (d.journal || []).length +
    ' événements</summary>' + rendreEvenements(d.journal || [], true) + '</details>' +
    '<details class="act-bloc"><summary>Rapport JSON déposé</summary><pre>' +
    esc(JSON.stringify(d.rapport || {}, null, 2)) + '</pre></details>' +
    '<details class="act-bloc" open><summary>Activités produites · ' + activites.length +
    '</summary>' + actes + (activation.suite ? '<div class="act-activite"><header><span>Suite</span></header><p>' +
    esc(activation.suite) + '</p></div>' : '') + '</details>';
  e.dataset.activationId = x.id;
  actualiserBoutonCopieActivation();
}

function rendreMaison(d) {
  const t = (d.tissu || {}).presence, e = document.getElementById('maison');
  if (!t) { e.innerHTML = '<h2>La maison</h2><div class="alertes"><div class="tiede">Aucun tissu.</div></div>'; return; }
  if (t.erreur) { e.innerHTML = '<h2>La maison</h2><div class="alertes"><div class="grave">' + esc(t.erreur) + '</div></div>'; return; }
  let h = '<h2>Où est chacun <span class="compte">' + (t.salles || []).length + ' salles</span></h2><table>';
  (t.salles || []).forEach(function (s) {
    h += '<tr><td>' + esc(s.salle) + '</td><td>' + s.gens.map(esc).join(', ') + '</td></tr>';
  });
  h += '</table>';
  if ((t.en_chemin || []).length) {
    h += '<h2>Dans les escaliers <span class="compte">' + t.en_chemin.length +
         '</span></h2><table>';
    t.en_chemin.forEach(function (x) {
      h += '<tr><td>' + esc(x.qui) + '</td><td>' + esc(x.de) + ' → ' + esc(x.vers) + '</td></tr>';
    });
    h += '</table>';
  } else {
    h += '<div class="alertes"><div>Personne dans les escaliers à cette minute.</div></div>';
  }
  e.innerHTML = h;
}

// LE QUARTIER ET LES CREUX, à la place des convocations et de l'excitation.
// On n'affiche plus un compteur qui disait qui a ENVIE de parler, mais la
// journée elle-même : jusqu'où le joueur peut atteindre quelqu'un, et combien
// de temps la routine laisse à chacun. Un homme sans creux ne pensera pas
// aujourd'hui, si fort soit-il — c'est le coût d'un mandat, et il se voit ici.
function rendreTravail(d) {
  const t = d.tissu || {}, e = document.getElementById('travail');
  const q = t.quartier || {}, creux = t.creux || [];
  let h = '';

  if (q.erreur) {
    h += '<h2>Quartier</h2><div class="alertes"><div><b>Incalculable</b> — ' +
         esc(q.erreur) + '</div></div>';
    e.innerHTML = h; return;
  }

  h += '<h2>Le quartier <span class="compte">' + (q.dedans || 0) +
       ' à portée</span></h2>';
  h += '<div class="alertes"><div class="tiede">Même composante connexe, ' +
       (q.rayon_minutes || '?') + ' minutes de marche au plus. ' +
       'Hors quartier : on ne bouge pas, on ne pense pas — mais les échéances ' +
       'tombent quand même.</div>';
  (q.ancres || []).forEach(function (a) {
    h += '<div><b>' + esc(a.qui) + '</b> — ' + esc(a.salle || '?') +
         (a.minute != null ? ', ' + Math.floor(a.minute / 60) + 'h' +
          String(a.minute % 60).padStart(2, '0') : '') + '</div>';
  });
  h += '</div>';

  if ((q.dehors || []).length) {
    h += '<h2>Dehors <span class="compte">' + q.dehors.length + '</span></h2>' +
         '<table><tr><th>motif</th><th>qui</th></tr>';
    q.dehors.forEach(function (x) {
      h += '<tr><td>' + esc(x.motif) + '</td><td>' + esc(x.nom || x.qui) +
           '</td></tr>';
    });
    h += '</table>';
  }

  h += '<h2>Qui a du temps aujourd\'hui <span class="compte">' + creux.length +
       '</span></h2>' +
       '<table><tr><th>minutes</th><th>qui</th><th>à</th><th>ses creux</th></tr>';
  creux.forEach(function (x) {
    const plages = (x.creux || []).map(function (c) {
      return Math.floor(c.de / 60) + 'h' + String(c.de % 60).padStart(2, '0') +
             '–' + Math.floor(c.a / 60) + 'h' + String(c.a % 60).padStart(2, '0') +
             ' ' + c.salle;
    }).join(' · ');
    h += '<tr><td class="num">' + x.creux_total + '</td><td>' +
         esc(x.nom || x.qui) + '</td><td>' + esc(x.salle || '') +
         '</td><td class="tiede">' + esc(plages) + '</td></tr>';
  });
  h += '</table>';
  e.innerHTML = h;
}

function rendreEnFace(d) {
  const P = (d.tissu || {}).en_face || [], e = document.getElementById('enface');
  if (!P.length) { e.innerHTML = '<h2>En face</h2><div class="alertes"><div class="tiede">Aucun plan adverse écrit.</div></div>'; return; }
  let h = '';
  P.forEach(function (p) {
    h += '<h2>' + esc(p.titre) + ' <span class="compte">' + esc(p.id) + '</span></h2>';
    h += '<table><tr><th>verrou</th><th>portée pour nous</th><th></th></tr>';
    (p.verrous || []).forEach(function (v) {
      h += '<tr><td>' + esc(v.id) + '</td><td>' + esc(v.portee) + '</td><td>' +
           esc(v.quoi) + '</td></tr>';
    });
    h += '</table>';
    if ((p.engendre || []).length) {
      h += '<h2>Ce que ça engendre chez nous</h2>';
      p.engendre.forEach(function (x) {
        h += '<div class="alertes"><div><b>[' + esc(x.type) + ']</b> ' +
             esc(x.sujet) + '</div><div class="tiede">' + esc(x.pourquoi) + '</div></div>';
      });
    }
    (p.tensions || []).forEach(function (x) {
      h += '<div class="alertes"><div class="grave">' + esc(x.id) + ' — ' +
           esc(x.monnaie) + '</div><div>' + esc(x.ecart) + '</div></div>';
    });
  });
  e.innerHTML = h;
}

async function charger() {
  const r = await fetch("/admin/donnees", { cache: "no-store" });
  const d = await r.json();
  if (d.erreur) { $("#pied").textContent = "erreur : " + d.erreur; return; }
  $("#date").textContent = d.date_texte
    + (d.tension === null ? "" : " · tension " + d.tension)
    + (d.phase ? " · " + d.phase : "");
  rendreTetes(d); rendreCalendrier(d); rendreActivites(d);
  rendreTissu(d); rendreGraphe(d);
  rendreMaison(d); rendreTravail(d); rendreEnFace(d);
  if (A.chargee) chargerActivations(true);
  const hs = Object.keys(d.horloges || {})
    .map((k) => k + " " + d.horloges[k].jour + "." + String(Math.floor(d.horloges[k].minute / 60)).padStart(2, "0")
      + "h" + String(d.horloges[k].minute % 60).padStart(2, "0")).join("  ·  ");
  $("#pied").textContent = "Horloges des sièges : " + hs + "   —   relu à "
    + new Date().toLocaleTimeString("fr-FR");
}
let lectureHorlogesEnCours=false;
async function relireHorloges() {
  if(lectureHorlogesEnCours||!G.data)return;
  lectureHorlogesEnCours=true;
  try {
    const r=await fetch("/admin/horloges",{cache:"no-store"});
    const d=await r.json();synchroniserHorloges(d.horloges||{});
    if(G.lentille==="importance"&&G.suivreTempsReel){G.animeImportance=true;reveillerGraphe(.08);}
  } catch(_e) {} finally {lectureHorlogesEnCours=false;}
}
charger().then(()=>{
  const test=new URLSearchParams(location.search).get("test")||"";
  if(test.startsWith("flux-causal")){
    document.querySelector('nav button[data-onglet="graphe"]').click();
    return;
  }
  // On rouvre l'onglet que l'URL demande, une fois les donnees la : le clic
  // passe par le meme chemin que la main du regisseur, donc rien a dupliquer.
  const onglet=ongletDeLURL();
  if(onglet)document.querySelector('nav button[data-onglet="'+CSS.escape(onglet)+'"]').click();
});
setInterval(relireHorloges,1000);
setInterval(actualiserFilMjActif,2000);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)actualiserFilMjActif();
});
setInterval(()=>{
  if(document.getElementById("graphe").classList.contains("actif"))
    chargerActionsActivationGraphe();
},10000);
