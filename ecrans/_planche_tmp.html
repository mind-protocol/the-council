<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Planche portraits</title>
<style>
body{background:#161210;color:#cbb98a;font-family:Georgia,serif;padding:16px}
.g{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.c{text-align:center;font-size:11px}
img{width:110px;height:110px;display:block;margin:0 auto 4px}
</style></head><body><div class="g" id="g"></div>
<script>
const ids=["aegon-ii","alicent","otto","criston","aemond","larys","helaena","orwyle",
"rhaenyra","daemon","corlys","rhaenys","jacaerys","lucerys","mysaria",
"lord-rosby","lord-stokeworth","gunthor-darklyn","lord-staunton","bartimos-celtigar","lord-bar-emmon",
"daeron","baela","rhaena","aegon-le-jeune","viserys-le-jeune","cregan-stark","jeyne-arryn",
"borros-baratheon","jason-lannister","ormund-hightower"];
document.getElementById('g').innerHTML=ids.map(i=>`<div class="c"><img src="/portraits/${i}.svg">${i}</div>`).join('');
</script></body></html>
