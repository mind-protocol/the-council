<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Nicolas Lesster Reynolds">
  <title>Nicolas Lesster Reynolds</title>
  <defs>
    <radialGradient id="bg-nlr" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#22301f"/>
      <stop offset="55%" stop-color="#1a2418"/>
      <stop offset="100%" stop-color="#0d120c"/>
    </radialGradient>
    <clipPath id="clip-nlr"><circle cx="64" cy="64" r="52"/></clipPath>
  </defs>
  <!-- anneau héraldique : sinople et or, les émaux de Pierrefitte -->
  <circle cx="64" cy="64" r="63" fill="#1d271b"/>
  <circle cx="64" cy="64" r="57.5" fill="none" stroke="#4a7346" stroke-width="7"/>
  <circle cx="64" cy="64" r="57.5" fill="none" stroke="#c9a227" stroke-width="1.6" stroke-dasharray="3 9"/>
  <!-- disque intérieur -->
  <circle cx="64" cy="64" r="52" fill="url(#bg-nlr)" stroke="#5f7057" stroke-width="1.2"/>
  <g clip-path="url(#clip-nlr)">
    <!-- laine de voyage, vert de futaie : il arrive, il ne paraît pas -->
    <path d="M45,48 C44,31 54,26 64,26 C74,26 84,31 83,48 L86,92 C87,102 80,107 74,106 L54,106 C48,107 41,102 42,92 Z" fill="#41563c"/>
    <path d="M22,128 C27,99 46,88 64,88 C82,88 101,99 106,128 Z" fill="#2e3d2b"/>
    <!-- col ouvert, manches retroussées suggérées par le pli d'épaule -->
    <path d="M52,90 L64,104 L76,90" fill="none" stroke="#5f7a56" stroke-width="3"/>
    <!-- l'écritoire de ceinture, qu'il n'ôte jamais -->
    <rect x="82" y="100" width="17" height="13" rx="1.6" fill="#3b2f22" stroke="#8a7454" stroke-width="1.2"/>
    <path d="M85,104 h11 M85,107 h11 M85,110 h7" stroke="#a8956f" stroke-width="1" fill="none"/>
    <!-- le fil à plomb pendu à la boutonnière -->
    <path d="M44,92 V100" stroke="#c9c3b2" stroke-width="1.1" fill="none"/>
    <path d="M44,100 L41.6,103 L44,106.5 L46.4,103 Z" fill="#c9a227"/>
    <!-- visage -->
    <ellipse cx="64" cy="55" rx="15" ry="18" fill="#9a7f60"/>
    <!-- cheveux courts, coupés net : rien qui traîne dans une cale -->
    <path d="M48,54 C47,35 54,28 64,28 C74,28 81,35 80,54 C78,44 72,40 64,40 C56,40 50,44 48,54 Z" fill="#33281e"/>
    <!-- le regard de biais de quelqu'un qui compte pendant qu'on lui parle -->
    <path d="M55,53 h6 M67,53 h6" stroke="#2a2016" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M58,66 c3,1.6 6,1.6 9,0" stroke="#5c4630" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- badge de maison : l'équerre et son fil -->
  <circle cx="64" cy="113" r="11.5" fill="#131810" stroke="#5f7057" stroke-width="1.2"/>
  <g transform="translate(64 113) scale(1.15)">
    <path d="M-3.2,-3.9 h1.5 v5.3 h4.9 v1.5 h-6.4 z" fill="#c9a227"/>
    <path d="M0.9,-3.9 V-1.3" stroke="#e9e3d5" stroke-width="0.55" fill="none" stroke-linecap="round"/>
    <path d="M0.9,-1.1 L-0.15,-0.1 L0.9,0.9 L1.95,-0.1 Z" fill="#e9e3d5"/>
  </g>
</svg>
