<path d="M1254,64 L1396,64 L1410,78 L1410,102 L1396,116 L1254,116 L1240,102 L1240,78 Z" fill="#efe4cb" stroke="#4a4033" stroke-width="2"/>
<text x="1325" y="70" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75"></text>
<text x="1325" y="88" font-size="13" text-anchor="middle" fill="#2f2a22">Les hommes qui ouvrent les</text>
<text x="1325" y="102" font-size="13" text-anchor="middle" fill="#2f2a22">portes du Donjon Rouge</text>
<path d="M785,181 h190 v58 h-190 Z" fill="#e6ddc6" stroke="#4a4033" stroke-width="2"/>
<text x="880" y="190" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6000</text>
<text x="880" y="208" font-size="13" text-anchor="middle" fill="#2f2a22">Le commandement du Guet</text>
<text x="880" y="222" font-size="13" text-anchor="middle" fill="#2f2a22">est connu, homme par homme</text>
<path d="M1745,181 h190 v58 h-190 Z" fill="#e6ddc6" stroke="#4a4033" stroke-width="2"/>
<text x="1840" y="190" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6100</text>
<text x="1840" y="208" font-size="13" text-anchor="middle" fill="#2f2a22">Quelqu'un de l'intérieur</text>
<text x="1840" y="222" font-size="13" text-anchor="middle" fill="#2f2a22">nous ouvre</text>
<path d="M552,340 L574,311 L706,311 L728,340 L706,369 L574,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">6001</text>
<text x="640" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Nous n'avons pas un seul</text>
<text x="640" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">nom</text>
<path d="M1032,340 L1054,311 L1186,311 L1208,340 L1186,369 L1054,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="1120" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">6002</text>
<text x="1120" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Le crédit de mon époux</text>
<text x="1120" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">n'est pas éprouvé</text>
<path d="M1632,340 L1654,311 L1786,311 L1808,340 L1786,369 L1654,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="1720" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">6101</text>
<text x="1720" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Toutes les entrées</text>
<text x="1720" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">s'ouvrent de leur main</text>
<path d="M2102,340 L2124,311 L2256,311 L2278,340 L2256,369 L2124,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="2190" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">6102</text>
<text x="2190" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Approcher quelqu'un, c'est</text>
<text x="2190" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">le dénoncer</text>
<path d="M640,438 L738,470 L640,502 L542,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6010</text>
<text x="640" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">Compter le Guet par des</text>
<text x="640" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">yeux qui y sont</text>
<text x="640" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">retenue</text>
<path d="M1120,438 L1218,470 L1120,502 L1022,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="1120" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6020</text>
<text x="1120" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">Éprouver le nom avant de</text>
<text x="1120" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">s'en servir</text>
<text x="1120" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à étudier</text>
<path d="M1720,438 L1818,470 L1720,502 L1622,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="1720" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6110</text>
<text x="1720" y="473" font-size="13" text-anchor="middle" fill="#2f2a22">L'homme de l'intérieur</text>
<text x="1720" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à étudier</text>
<path d="M547,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6030</text>
<text x="640" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Nommer qui commande chaque</text>
<text x="640" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">porte</text>
<text x="640" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire — avant le 30e</text>
<path d="M547,619 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="626" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6031</text>
<text x="640" y="634" font-size="12" text-anchor="middle" fill="#2f2a22">Savoir ce que chacun doit et à</text>
<text x="640" y="648" font-size="12" text-anchor="middle" fill="#2f2a22">qui</text>
<text x="640" y="660" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire — après 6030</text>
<path d="M1027,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="1120" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6032</text>
<text x="1120" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Faire prononcer le nom de mon</text>
<text x="1120" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">époux devant un officier</text>
<text x="1120" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire</text>
<path d="M1027,619 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="1120" y="626" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6033</text>
<text x="1120" y="634" font-size="12" text-anchor="middle" fill="#2f2a22">Écrire l'offre avant d'en</text>
<text x="1120" y="648" font-size="12" text-anchor="middle" fill="#2f2a22">avoir besoin</text>
<text x="1120" y="660" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire</text>
<path d="M1627,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="1720" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6120</text>
<text x="1720" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Établir quelle poterne existe</text>
<text x="1720" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">encore, et qui l'ouvre</text>
<text x="1720" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire</text>
<path d="M1627,619 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="1720" y="626" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6121</text>
<text x="1720" y="634" font-size="12" text-anchor="middle" fill="#2f2a22">Approcher l'homme hors de tout</text>
<text x="1720" y="648" font-size="12" text-anchor="middle" fill="#2f2a22">canal</text>
<text x="1720" y="660" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">bloqué — aucun office n'a charge de quelqu'un dans cette ville</text>
<path d="M1627,665 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="1720" y="672" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">6122</text>
<text x="1720" y="680" font-size="12" text-anchor="middle" fill="#2f2a22">Convenir d'un signal qui ne</text>
<text x="1720" y="694" font-size="12" text-anchor="middle" fill="#2f2a22">s'interprète pas</text>
<text x="1720" y="706" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire — après 6121</text>
<circle cx="130" cy="96" r="27" fill="#dfe6df" stroke="#4a4033" stroke-width="2"/>
<text x="130" y="100" font-size="11" text-anchor="middle" fill="#2f2a22">M12</text>
<text x="130" y="138" font-size="11" text-anchor="middle" fill="#4a4033">Le papier et la</text>
<text x="130" y="151" font-size="11" text-anchor="middle" fill="#4a4033">plume</text>
<circle cx="130" cy="152" r="27" fill="#dfe6df" stroke="#4a4033" stroke-width="2"/>
<text x="130" y="156" font-size="11" text-anchor="middle" fill="#2f2a22">M27</text>
<text x="130" y="194" font-size="11" text-anchor="middle" fill="#4a4033">Le Ver Blanc</text>
<rect x="2491" y="73" width="58" height="46" rx="3" fill="#dcdfe9" stroke="#4a4033" stroke-width="3"/>
<text x="2520" y="100" font-size="11" text-anchor="middle" fill="#2f2a22">O03</text>
<text x="2520" y="138" font-size="11" text-anchor="middle" fill="#4a4033">Maîtresse des</text>
<text x="2520" y="151" font-size="11" text-anchor="middle" fill="#4a4033">nouvelles de la…</text>
<rect x="2491" y="129" width="58" height="46" rx="3" fill="#dcdfe9" stroke="#4a4033" stroke-width="3"/>
<text x="2520" y="156" font-size="11" text-anchor="middle" fill="#2f2a22">O07</text>
<text x="2520" y="194" font-size="11" text-anchor="middle" fill="#4a4033">La roukerie, et</text>
<text x="2520" y="207" font-size="11" text-anchor="middle" fill="#4a4033">tout ce qui part…</text>
<text x="40" y="802" font-size="11" fill="#8a7f66">La nappe montre ; le registre fait foi. Dessinee depuis les registres — rien ici n'a ete saisi deux fois.</text>
</svg>