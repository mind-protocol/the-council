<text x="520" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">2010</text>
<text x="520" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">Rendre des bouches au</text>
<text x="520" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">continent</text>
<text x="520" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à étudier</text>
<path d="M1000,438 L1098,470 L1000,502 L902,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="1000" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">2110</text>
<text x="1000" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">Marquer au rôle plus vite</text>
<text x="1000" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">qu'on n'use</text>
<text x="1000" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">retenue</text>
<path d="M417,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="510" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">2020</text>
<text x="510" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Compter ce que mangent les</text>
<text x="510" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">venus</text>
<text x="510" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire</text>
<path d="M897,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="990" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">2120</text>
<text x="990" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Payer les marqués avant qu'ils</text>
<text x="990" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">s'arment seuls</text>
<text x="990" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">en cours</text>
<text x="40" y="710" font-size="11" fill="#8a7f66">La nappe montre ; le registre fait foi. Dessinee depuis les registres — rien ici n'a ete saisi deux fois.</text>
