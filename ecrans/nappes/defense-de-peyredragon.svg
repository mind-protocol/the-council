<text x="640" y="190" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">2000</text>
<text x="640" y="213" font-size="13" text-anchor="middle" fill="#2f2a22">Île tenable</text>
<path d="M905,181 h190 v58 h-190 Z" fill="#e6ddc6" stroke="#4a4033" stroke-width="2"/>
<text x="1000" y="190" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">2100</text>
<text x="1000" y="208" font-size="13" text-anchor="middle" fill="#2f2a22">Murs tenus sans user les</text>
<text x="1000" y="222" font-size="13" text-anchor="middle" fill="#2f2a22">hommes</text>
<path d="M432,340 L454,311 L586,311 L608,340 L586,369 L454,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="520" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">2001</text>
<text x="520" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Plus de bouches que de</text>
<text x="520" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">charge</text>
<path d="M912,340 L934,311 L1066,311 L1088,340 L1066,369 L934,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="1000" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">2101</text>
<text x="1000" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Trois cents hommes pour</text>
<text x="1000" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">des murs qui en demandent…</text>
