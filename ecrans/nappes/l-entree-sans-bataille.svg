<text x="1330" y="70" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75"></text>
<text x="1330" y="93" font-size="13" text-anchor="middle" fill="#2f2a22">L'entrée sans bataille</text>
<path d="M665,181 h190 v58 h-190 Z" fill="#e6ddc6" stroke="#4a4033" stroke-width="2"/>
<text x="760" y="190" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4000</text>
<text x="760" y="213" font-size="13" text-anchor="middle" fill="#2f2a22">Le Compte</text>
<path d="M1265,181 h190 v58 h-190 Z" fill="#e6ddc6" stroke="#4a4033" stroke-width="2"/>
<text x="1360" y="190" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4100</text>
<text x="1360" y="213" font-size="13" text-anchor="middle" fill="#2f2a22">Le Même Jour</text>
<path d="M1625,181 h190 v58 h-190 Z" fill="#e6ddc6" stroke="#4a4033" stroke-width="2"/>
<text x="1720" y="190" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4200</text>
<text x="1720" y="213" font-size="13" text-anchor="middle" fill="#2f2a22">Le Verdict</text>
<path d="M1985,181 h190 v58 h-190 Z" fill="#e6ddc6" stroke="#4a4033" stroke-width="2"/>
<text x="2080" y="190" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4300</text>
<text x="2080" y="213" font-size="13" text-anchor="middle" fill="#2f2a22">La Porte Ouverte</text>
<path d="M672,340 L694,311 L826,311 L848,340 L826,369 L694,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="760" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">4001</text>
<text x="760" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Les forces de terre sont</text>
<text x="760" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">sans porteur</text>
<path d="M1272,340 L1294,311 L1426,311 L1448,340 L1426,369 L1294,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="1360" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">4101</text>
<text x="1360" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Les deux axes n'ont pas</text>
<text x="1360" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">d'horloge commune</text>
<path d="M1632,340 L1654,311 L1786,311 L1808,340 L1786,369 L1654,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="1720" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">4201</text>
<text x="1720" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Rien n'est écrit de ce</text>
<text x="1720" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">qu'on fera d'eux</text>
<path d="M1872,340 L1894,311 L2026,311 L2048,340 L2026,369 L1894,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="1960" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">4301</text>
<text x="1960" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Rien n'écrit ce qu'un</text>
<text x="1960" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">dragon n'a pas le droit d…</text>
<path d="M2112,340 L2134,311 L2266,311 L2288,340 L2266,369 L2134,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="2200" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">4302</text>
<text x="2200" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Fermer le Donjon ferme la</text>
<text x="2200" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">ville avec lui</text>
<path d="M760,438 L858,470 L760,502 L662,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="760" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4010</text>
<text x="760" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">Le porteur avant le</text>
<text x="760" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">chiffre</text>
<text x="760" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">retenue</text>
<path d="M1360,438 L1458,470 L1360,502 L1262,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="1360" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4110</text>
<text x="1360" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">Un seul calendrier, tenu</text>
<text x="1360" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">par l'office qui écoute</text>
<text x="1360" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à étudier</text>
<path d="M1720,438 L1818,470 L1720,502 L1622,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="1720" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4210</text>
<text x="1720" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">Trancher à froid ce qu'on</text>
<text x="1720" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">ne pourra plus trancher à…</text>
<text x="1720" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à étudier</text>
<path d="M1960,438 L2058,470 L1960,502 L1862,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="1960" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4310</text>
<text x="1960" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">La licence de vol écrite</text>
<text x="1960" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">avant l'entrée</text>
<text x="1960" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">retenue</text>
<path d="M2200,438 L2298,470 L2200,502 L2102,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="2200" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4311</text>
<text x="2200" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">La clause des ports pour</text>
<text x="2200" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">modèle : tenir sans fermer</text>
<text x="2200" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">retenue</text>
<path d="M667,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="760" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4020</text>
<text x="760" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Arrêter les quatre catégories</text>
<text x="760" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">et ce que chacune doit rendre</text>
<text x="760" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire — avant le 28e au soir</text>
<path d="M667,619 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="760" y="626" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4021</text>
<text x="760" y="634" font-size="12" text-anchor="middle" fill="#2f2a22">Demander à la reine le nom qui</text>
<text x="760" y="648" font-size="12" text-anchor="middle" fill="#2f2a22">répondra des hommes de terre</text>
<text x="760" y="660" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire — après 4020</text>
<path d="M667,665 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="760" y="672" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4022</text>
<text x="760" y="680" font-size="12" text-anchor="middle" fill="#2f2a22">Croiser le livre de Rulf et le</text>
<text x="760" y="694" font-size="12" text-anchor="middle" fill="#2f2a22">compte du quai sur les quilles</text>
<text x="760" y="706" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">en cours — ce matin</text>
<path d="M1267,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="1360" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4120</text>
<text x="1360" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Tenir les deux dates dans un</text>
<text x="1360" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">même feuillet</text>
<text x="1360" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire</text>
<path d="M1267,619 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="1360" y="626" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4121</text>
<text x="1360" y="634" font-size="12" text-anchor="middle" fill="#2f2a22">Fixer avec dame Alarra le jour</text>
<text x="1360" y="648" font-size="12" text-anchor="middle" fill="#2f2a22">de ses trois enveloppes</text>
<text x="1360" y="660" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire — après 4120</text>
<path d="M1617,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="1710" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4220</text>
<text x="1710" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Porter la question au conseil</text>
<text x="1710" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">avec les trois issues déjà…</text>
<text x="1710" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire</text>
<path d="M1857,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="1950" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4320</text>
<text x="1950" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Écrire ce qu'un dragon peut</text>
<text x="1950" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">faire au-dessus d'une ville…</text>
<text x="1950" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire</text>
<path d="M2097,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="2190" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">4321</text>
<text x="2190" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Placer les trois copies de la</text>
<text x="2190" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">clause au port</text>
<text x="2190" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">en cours — ce matin, à la marée</text>
<text x="40" y="802" font-size="11" fill="#8a7f66">La nappe montre ; le registre fait foi. Dessinee depuis les registres — rien ici n'a ete saisi deux fois.</text>
</svg>