<text x="550" y="70" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75"></text>
<text x="550" y="93" font-size="13" text-anchor="middle" fill="#2f2a22">Alliances du Nord</text>
<path d="M545,181 h190 v58 h-190 Z" fill="#e6ddc6" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="190" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">3000</text>
<text x="640" y="213" font-size="13" text-anchor="middle" fill="#2f2a22">Le Nord et le Val engagés</text>
<path d="M552,340 L574,311 L706,311 L728,340 L706,369 L574,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">3001</text>
<text x="640" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Rien d'écrit de ce qu'il</text>
<text x="640" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">peut promettre</text>
<path d="M640,438 L738,470 L640,502 L542,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">3010</text>
<text x="640" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">La licence écrite avant le</text>
<text x="640" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">départ</text>
<text x="640" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">retenue</text>
<path d="M547,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">3020</text>
<text x="640" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Écrire ce qu'il a le droit de</text>
<text x="640" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">promettre</text>
<text x="640" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire — avant le 4e de la 4e</text>
<path d="M547,619 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="626" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">3021</text>
<text x="640" y="634" font-size="12" text-anchor="middle" fill="#2f2a22">Le faire partir, et tenir le</text>
<text x="640" y="648" font-size="12" text-anchor="middle" fill="#2f2a22">délai des quinze jours</text>
<text x="640" y="660" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire — le 4e de la 4e lune</text>
<text x="40" y="756" font-size="11" fill="#8a7f66">La nappe montre ; le registre fait foi. Dessinee depuis les registres — rien ici n'a ete saisi deux fois.</text>
</svg>