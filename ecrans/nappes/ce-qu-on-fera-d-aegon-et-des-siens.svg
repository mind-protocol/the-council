<text x="725" y="70" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75"></text>
<text x="725" y="88" font-size="13" text-anchor="middle" fill="#2f2a22">Ce qu'on fera d'Aegon et</text>
<text x="725" y="102" font-size="13" text-anchor="middle" fill="#2f2a22">des siens</text>
<path d="M665,181 h190 v58 h-190 Z" fill="#e6ddc6" stroke="#4a4033" stroke-width="2"/>
<text x="760" y="190" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">7100</text>
<text x="760" y="208" font-size="13" text-anchor="middle" fill="#2f2a22">Elle tient le jour où elle</text>
<text x="760" y="222" font-size="13" text-anchor="middle" fill="#2f2a22">coûte</text>
<path d="M552,340 L574,311 L706,311 L728,340 L706,369 L574,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">7101</text>
<text x="640" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Le premier homme dans</text>
<text x="640" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">l'escalier décidera</text>
<path d="M902,340 L924,311 L1056,311 L1078,340 L1056,369 L924,369 Z" fill="#3a3230" stroke="#4a4033" stroke-width="2"/>
<text x="990" y="320" font-size="11" text-anchor="middle" fill="#f0e6d6" opacity="0.75">7102</text>
<text x="990" y="338" font-size="13" text-anchor="middle" fill="#f0e6d6">Les enfants ne sont pas</text>
<text x="990" y="352" font-size="13" text-anchor="middle" fill="#f0e6d6">une catégorie</text>
<path d="M640,438 L738,470 L640,502 L542,470 Z" fill="#e9dcc0" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="450" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">7110</text>
<text x="640" y="468" font-size="13" text-anchor="middle" fill="#2f2a22">Un homme dont c'est la</text>
<text x="640" y="482" font-size="13" text-anchor="middle" fill="#2f2a22">seule charge</text>
<text x="640" y="494" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à étudier</text>
<path d="M547,573 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="580" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">7120</text>
<text x="640" y="588" font-size="12" text-anchor="middle" fill="#2f2a22">Nommer celui qui répondra des</text>
<text x="640" y="602" font-size="12" text-anchor="middle" fill="#2f2a22">captifs</text>
<text x="640" y="614" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">bloqué — la charge n'existe pas</text>
<path d="M547,619 h186 v34 h-186 Z" fill="#efe9db" stroke="#4a4033" stroke-width="2"/>
<text x="640" y="626" font-size="11" text-anchor="middle" fill="#2f2a22" opacity="0.75">7121</text>
<text x="640" y="634" font-size="12" text-anchor="middle" fill="#2f2a22">Distinguer les enfants dans</text>
<text x="640" y="648" font-size="12" text-anchor="middle" fill="#2f2a22">l'écrit</text>
<text x="640" y="660" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire — après 7030</text>
<circle cx="130" cy="96" r="27" fill="#dfe6df" stroke="#4a4033" stroke-width="2"/>
<text x="130" y="100" font-size="11" text-anchor="middle" fill="#2f2a22">M12</text>
<text x="130" y="138" font-size="11" text-anchor="middle" fill="#4a4033">Le papier et la</text>
<text x="130" y="151" font-size="11" text-anchor="middle" fill="#4a4033">plume</text>
<rect x="1291" y="73" width="58" height="46" rx="3" fill="#dcdfe9" stroke="#4a4033" stroke-width="3"/>
<text x="1320" y="100" font-size="11" text-anchor="middle" fill="#2f2a22">O02</text>
<text x="1320" y="138" font-size="11" text-anchor="middle" fill="#4a4033">Maître des rôles,</text>
<text x="1320" y="151" font-size="11" text-anchor="middle" fill="#4a4033">gardien des règles</text>
<rect x="1291" y="129" width="58" height="46" rx="3" fill="#dcdfe9" stroke="#4a4033" stroke-width="3"/>
<text x="1320" y="156" font-size="11" text-anchor="middle" fill="#2f2a22">O03</text>
<text x="1320" y="194" font-size="11" text-anchor="middle" fill="#4a4033">Maîtresse des</text>
<text x="1320" y="207" font-size="11" text-anchor="middle" fill="#4a4033">nouvelles de la…</text>
<rect x="1291" y="185" width="58" height="46" rx="3" fill="#dcdfe9" stroke="#4a4033" stroke-width="3"/>
<text x="1320" y="212" font-size="11" text-anchor="middle" fill="#2f2a22">O07</text>
<text x="1320" y="250" font-size="11" text-anchor="middle" fill="#4a4033">La roukerie, et</text>
<text x="1320" y="263" font-size="11" text-anchor="middle" fill="#4a4033">tout ce qui part…</text>
<text x="40" y="756" font-size="11" fill="#8a7f66">La nappe montre ; le registre fait foi. Dessinee depuis les registres — rien ici n'a ete saisi deux fois.</text>
