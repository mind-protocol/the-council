<text x="1120" y="786" font-size="12" text-anchor="middle" fill="#2f2a22">ne rien faire d'autre</text>
<text x="1120" y="798" font-size="10" text-anchor="middle" fill="#2f2a22" opacity="0.7">à faire</text>
